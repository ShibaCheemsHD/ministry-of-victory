# Manual: saves a copy of every official game API endpoint on the "probe" branch, for study.
name: Probe the game API
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Extra pages to save (space separated)'
        required: false
        default: ''
      hs:
        description: 'Only dump helldiversstats orders (yes/no)'
        required: false
        default: 'no'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: ${{ inputs.hs == 'yes' }}
        run: node recorder/hsdump.mjs "$RUNNER_TEMP/probe"
      - if: ${{ inputs.hs != 'yes' }}
        # the input goes in as a variable, never pasted into the script (audit SEC-03)
        env:
          URLS: ${{ inputs.urls }}
        # with pages to save, only those (a full dump of the APIs fails while the community API is down)
        run: |
          if [ -n "$URLS" ]; then node recorder/probe3.mjs "$RUNNER_TEMP/probe/web"
          else node recorder/probe.mjs "$RUNNER_TEMP/probe" && node recorder/probe2.mjs "$RUNNER_TEMP/probe"; fi
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/probe"
          git init -q -b probe
          git config user.name "ministry-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "API probe $(date -u +%FT%TZ)"
          # the token goes in a header, never in a URL that git could print (audit SEC-05)
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0); echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -q -f "https://github.com/$REPO.git" probe:probe
