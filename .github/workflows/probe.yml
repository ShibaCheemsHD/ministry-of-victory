# Manual: saves a copy of every official game API endpoint on the "probe" branch, for study.
name: Probe the game API
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Extra pages to save (space separated)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node recorder/probe.mjs "$RUNNER_TEMP/probe" && node recorder/probe2.mjs "$RUNNER_TEMP/probe" && URLS="${{ inputs.urls }}" node recorder/probe3.mjs "$RUNNER_TEMP/probe/web"
      - run: |
          cd "$RUNNER_TEMP/probe"
          git init -q -b probe
          git config user.name "ministry-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "API probe $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe:probe
