# Records the war every ~10 minutes so the site has a history even when nobody has it open.
# The data lives on the "data" branch (one commit, replaced every run) and the page reads it from there.
name: Record the war

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Previous history
        run: git fetch --depth 1 origin data && git show origin/data:history.json > "$RUNNER_TEMP/history.json" || echo '{}' > "$RUNNER_TEMP/history.json"
      - name: Snapshot
        run: node recorder/record.mjs "$RUNNER_TEMP/history.json" "$RUNNER_TEMP/out"
      - name: Publish to the data branch
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b data
          git config user.name "ministry-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json intel.json recent.json
          git commit -q -m "War record $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data:data
