name: Diagnose current UI
on:
  push:
    branches: [diagnostic/forecast-evidence]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          python3 tools/build.py --check
      - run: |
          python3 -u - <<'PY'
          from playwright.sync_api import sync_playwright
          import os,json,time
          with sync_playwright() as p:
            b=p.chromium.launch()
            for sc in ['default','intel','sniper']:
              pg=b.new_page(viewport={'width':1366,'height':900})
              errs=[]
              pg.on('pageerror', lambda e: errs.append(str(e)))
              pg.on('console', lambda m: errs.append(m.text) if m.type=='error' else None)
              pg.goto('file://'+os.getcwd()+'/build/test.html?s='+sc)
              pg.wait_for_timeout(2000)
              pg.evaluate("document.querySelectorAll('.share-menu').forEach(d=>d.open=true)")
              buttons=pg.locator('[data-shareimg]:visible')
              result={'scenario':sc,'shareButtons':buttons.count()}
              if buttons.count():
                buttons.first.click()
                try:
                  pg.wait_for_selector('#share-body img',timeout=10000)
                  result['share']='ok'
                except Exception:
                  result['share']='failed'
                  result['shareText']=pg.locator('#share-body').inner_text()
                  result['fonts']=pg.evaluate('document.fonts.status')
              result['errors']=errs
              result['missingTexts']=pg.evaluate('[...(window.__missingT||[])]')
              print(json.dumps(result),flush=True)
              pg.close()
            b.close()
          PY
