# Every change to the site is tested before anyone sees it: the forecast maths, the reading of the
# game's texts, and the page itself in every scenario plus random data (tests/).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The published page and the recorder's engine match the source
        run: python3 tools/build.py --check
      - name: No undefined names or dead code (ESLint)
        run: npx --yes eslint@9.14.0 -c tools/eslint.config.mjs --max-warnings 0 build/app.js src/engine.js
      - name: Engine and text-reading tests
        run: node --test tests/*.test.mjs
      - name: Recorder scripts parse
        run: for f in recorder/*.mjs; do node --check "$f"; done
      - name: Page in every scenario and with random data
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          python3 tests/page_test.py 40
      - name: Accessibility (axe-core on every view, dialogs by keyboard)
        run: |
          npm i --no-save axe-core@4.10.2
          python3 tests/a11y_test.py

  # The page goes online only once every test above has passed (audit OPS-01).
  # Needs Settings -> Pages -> Source: "GitHub Actions".
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: The site's files
        run: mkdir _site && cp index.html preview.png _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
