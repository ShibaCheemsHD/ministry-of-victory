<a class="skip-link" href="#main">Skip to the call</a>
<div class="app">
  <header class="mast">
    <div class="mast-in">
      <div class="brand">
        <svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 38 20 20 38 2 20Z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M13 16h14l-2.4 4H22v8h-4v-8h-2.6Z" fill="currentColor"/></svg>
        <h1 class="logo"><span class="l1">Ministry of</span> <span class="l2">Victory</span></h1>
        <span class="sub" id="tagline"></span>
      </div>
      <div class="mast-stats" id="hud-stats" aria-live="polite"></div>
      <div class="mast-actions">
        <button type="button" class="mbtn" id="refresh"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.1 5.6A4.6 4.6 0 1 0 12.6 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12.6 2.9v2.9H9.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="mb-l" id="l-refresh"></span></button>
        <button type="button" class="mbtn" id="open-archive" aria-pressed="false"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v3H2zM3 6v7h10V6M6.5 8.5h3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="mb-l" id="l-archive"></span></button>
        <button type="button" class="mbtn" id="open-faq" data-faq="count"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h7.5L13 5v8.5H3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.5 7h5M5.5 9.5h5M5.5 12h3" stroke="currentColor" stroke-width="1.5"/></svg><span class="mb-l" id="l-faq"></span></button>
        <button type="button" class="mbtn" id="open-info"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.2 6.3a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".9" fill="currentColor"/></svg><span class="mb-l" id="l-info"></span></button>
        <button type="button" class="mbtn" id="open-settings"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Zm6 3.5V7.3l-1.6-.4-.5-1.2.9-1.4-1-1-1.4.9-1.2-.5L8.7 2H7.3l-.4 1.6-1.2.5-1.4-.9-1 1 .9 1.4-.5 1.2L2 7.3v1.4l1.6.4.5 1.2-.9 1.4 1 1 1.4-.9 1.2.5.4 1.6h1.4l.4-1.6 1.2-.5 1.4.9 1-1-.9-1.4.5-1.2Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><span class="mb-l" id="l-settings"></span></button>
      </div>
    </div>
  </header>

  <main class="shell" id="main" tabindex="-1">
    <nav class="ot-nav" id="ot-nav" aria-label="Orders"><div class="order-tabs" id="order-tabs" role="tablist"></div><div id="cross"></div></nav>
    <div id="intel" hidden></div>
    <div id="errors"></div>
    <div id="stale"></div>
      <div class="skeleton" id="skeleton" role="status">
        <p class="sk-note" id="sk-note"></p>
        <div class="sk" style="height:4px;width:220px;max-width:100%" aria-hidden="true"></div>
      </div>
    <div id="view"></div>
    <footer id="footer"></footer>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg-settings" aria-labelledby="settings-title">
  <div class="dlg-head"><h2 id="settings-title"></h2><button type="button" class="mbtn icon-only" data-close aria-label="Close"><svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
  <div class="dlg-body">
    <div class="settings">
      <section class="set-group">
        <h3 id="l-g-display"></h3>
        <label class="field"><span class="f-l" id="l-motion"></span>
          <select id="s-motion"><option value="full"></option><option value="reduced"></option></select>
          <small class="f-h" id="h-motion"></small>
        </label>
        <label class="field"><span class="f-l" id="l-layout"></span>
          <select id="s-layout"><option value="full"></option><option value="glance"></option></select>
          <small class="f-h" id="h-layout"></small>
        </label>
        <label class="field"><span class="f-l" id="l-notify"></span>
          <select id="s-notify"><option value="off"></option><option value="on"></option></select>
          <small class="f-h" id="h-notify"></small>
        </label>
      </section>
      <details class="set-group adv" id="set-adv">
        <summary><span id="l-g-model"></span></summary>
        <p class="adv-note" id="h-model"></p>
        <label class="field"><span class="f-l" id="l-cap"></span>
          <select id="s-capmode"><option value="auto"></option><option value="manual"></option></select>
          <small class="f-h" id="h-cap"></small>
        </label>
        <label class="field" id="f-capval"><span class="f-l" id="l-capval"></span><input id="s-cap" type="number" min="20000" max="300000" step="1000" inputmode="numeric"><small class="f-h" id="h-capval"></small></label>
        <label class="field"><span class="f-l" id="l-dss"></span><input id="s-dss" type="number" min="0" max="1" step="0.01" inputmode="decimal"><small class="f-h" id="h-dss"></small></label>
        <label class="field"><span class="f-l" id="l-hod"></span><input id="s-hod" type="number" min="1" max="3" step="0.05" inputmode="decimal"><small class="f-h" id="h-hod"></small></label>
        <label class="field"><span class="f-l" id="l-rec"></span><input id="s-rec" type="number" min="0.3" max="1" step="0.01" inputmode="decimal"><small class="f-h" id="h-rec"></small></label>
        <button type="button" class="btn ghostly" id="s-reset"></button>
      </details>
      <section class="set-group">
        <h3 id="l-g-api"></h3>
        <label class="field"><span class="f-l" id="l-contact"></span><input id="s-contact" type="text" maxlength="80" autocomplete="off" placeholder="ministry-of-victory-user"><small class="f-h" id="h-contact"></small></label>
      </section>
    </div>
  </div>
</dialog>

<dialog id="dlg-share" aria-labelledby="share-title">
  <div class="dlg-head"><h2 id="share-title"></h2><button type="button" class="mbtn icon-only" data-close aria-label="Close"><svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
  <div class="dlg-body" id="share-body"></div>
</dialog>

<dialog id="dlg-faq" aria-labelledby="faq-title">
  <div class="dlg-head"><h2 id="faq-title"></h2><button type="button" class="mbtn icon-only" data-close aria-label="Close"><svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
  <div class="dlg-body" id="faq-body"></div>
</dialog>
<dialog id="dlg-info" aria-labelledby="info-title">
  <div class="dlg-head"><h2 id="info-title"></h2><button type="button" class="mbtn icon-only" data-close aria-label="Close"><svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
  <div class="dlg-body" id="explain"></div>
</dialog>
