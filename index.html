<!doctype html>
<html lang="en">

<title>Ministry of Victory · Helldivers 2 Major Order terminal</title>
<meta name="description" content="Unofficial tactical terminal for Helldivers 2 Major Orders: can we win it, and what should the community do right now?">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Chakra+Petch:wght@400;500;600;700&family=Saira:wdth,wght@75..125,400..800&family=Share+Tech+Mono&display=swap">
<style>
/* Galactic War terminal: deep-space navy, Super Earth yellow, grey bracket frames, hatched rails.
   Layout: sticky HUD, order tabs, then per order a directive hero + side rail, sub-tabs below. */
:root {
  color-scheme: dark;
  --bg0: #000514;
  --bg1: #00123a;
  --panel: rgba(5, 13, 34, .88);
  --panel-solid: #061130;
  --panel-2: #0a1736;
  --panel-3: #11204a;
  --line: #24304d;
  --line-2: #5a6178;
  --hatch: #5d6273;
  --fg: #f1f2f4;
  --muted: #a8aebd;
  --dim: #6f778b;
  --yellow: #ffe900;
  --yellow-ink: #121000;
  --gold: #c9b169;
  --alert-bg: #3a0905;
  --alert-fg: #ffbb25;
  --alert-line: #8a3a2a;
  --ok: #5fd38d;
  --info: #6bb7ea;
  --warn: #ffbb25;
  --bad: #ff5148;
  --f-human: #6bb7ea;
  --f-terminid: #ffae3a;
  --f-automaton: #ff6767;
  --f-illuminate: #ab8dff;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --stencil: "Saira Stencil One", "Saira", Impact, "Arial Black", sans-serif;
  --display: "Saira", "Arial Narrow", "Roboto Condensed", sans-serif;
  --ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --gutter: max(16px, env(safe-area-inset-left, 0px));
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(1100px 560px at 50% -12%, var(--bg1), transparent 72%),
    radial-gradient(700px 420px at 100% 100%, rgba(0, 30, 90, .35), transparent 70%),
    var(--bg0);
  background-attachment: fixed;
  color: var(--fg);
  font: 15px/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
/* static star field + faint scanlines */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .55;
  background-image:
    radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 12%, #cfe 50%, transparent 51%),
    radial-gradient(1px 1px at 38% 64%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 46%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 86%, #dde 50%, transparent 51%),
    radial-gradient(1px 1px at 58% 32%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 92% 82%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 6% 52%, #fff 50%, transparent 51%);
  background-size: 640px 640px;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(255, 255, 255, .018) 2px 3px);
}
.app { position: relative; z-index: 1; padding-left: var(--gutter); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
.shell { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; text-wrap: balance; }
p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
.label { font: 600 12px/1.2 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- frames ---------- */
.panel { position: relative; background: var(--panel); border: 1px solid var(--line); }
.br::before, .br::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--line-2); pointer-events: none; }
.br::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.br::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.hatch-rail { position: absolute; top: 10px; bottom: 10px; width: 7px; background: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 6px); }
.hatch-rail.l { left: -12px; } .hatch-rail.r { right: -12px; }
.directive .hatch-rail.l { left: 10px; }
.calm *, .calm *::before, .calm *::after { animation: none !important; transition: none !important; }
.calm .boot { display: none; }
.hatch-rail.y { background: repeating-linear-gradient(135deg, var(--yellow) 0 2px, transparent 2px 6px); opacity: .85; }

/* ---------- HUD ---------- */
.hud {
  position: sticky; top: 0; z-index: 20;
  margin-left: calc(-1 * var(--gutter)); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px var(--gutter);
  background: linear-gradient(to bottom, rgba(0, 5, 20, .96), rgba(0, 5, 20, .86));
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.hud-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.brand { display: flex; align-items: baseline; gap: 12px; margin-right: auto; min-width: 0; }
.logo { font: 400 30px/1 var(--stencil); letter-spacing: .03em; color: var(--fg); white-space: nowrap; }
.logo b { color: var(--yellow); font-weight: 400; }
.brand .sub { font-size: 12px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; }
.hud-stats { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: center; }
.stat { display: grid; gap: 1px; min-width: 0; }
.stat .v { font: 400 18px/1.1 var(--mono); color: var(--fg); white-space: nowrap; }
.stat .v small { font-size: 12px; color: var(--muted); }
.stat .v .muted { font-size: 14px; color: var(--muted); }
.live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; box-shadow: 0 0 0 0 rgba(95, 211, 141, .6); animation: pulse 2s infinite; vertical-align: middle; }
.live.off { background: var(--dim); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(95, 211, 141, .55); } 70% { box-shadow: 0 0 0 9px rgba(95, 211, 141, 0); } 100% { box-shadow: 0 0 0 0 rgba(95, 211, 141, 0); } }
.hud-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn, .hud select {
  height: 36px; min-width: 36px; padding: 0 10px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--fg);
  display: inline-grid; place-items: center; font: 600 13px var(--ui); letter-spacing: .08em;
}
.icon-btn:hover, .hud select:hover { border-color: var(--fg); }
.ring-btn { position: relative; width: 36px; padding: 0; }
.ring-btn svg { position: absolute; inset: 3px; width: 28px; height: 28px; transform: rotate(-90deg); }
.ring-btn circle { fill: none; stroke-width: 2.5; }
.ring-btn .track { stroke: var(--line); }
.ring-btn .prog { stroke: var(--yellow); stroke-dasharray: 75.4; transition: stroke-dashoffset 1s linear; }
.ring-btn.busy .prog { animation: spin 1s linear infinite; stroke-dashoffset: 55 !important; transform-origin: 14px 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.ring-btn .ico { position: relative; width: 14px; height: 14px; }

/* ---------- order tabs ---------- */
.order-tabs { display: flex; gap: 8px; overflow-x: auto; padding-top: 4px; scrollbar-width: thin; }
.otab {
  position: relative; flex: 0 0 auto; max-width: 320px; text-align: left; padding: 10px 34px 12px 14px;
  background: rgba(10, 23, 54, .6); border: 1px solid var(--line-2); color: var(--muted);
  display: grid; gap: 2px; transition: border-color .2s, color .2s, background .2s;
}
.otab .k { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.otab .n { font: 700 15px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit; }
.otab .idx { position: absolute; right: 8px; bottom: 4px; font: 12px var(--mono); color: var(--dim); }
.otab .dot { width: 8px; height: 8px; display: inline-block; background: currentColor; }
.otab[aria-selected="true"] { color: var(--fg); border-color: var(--fg); background: rgba(16, 32, 74, .85); }
.otab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 26px; bottom: 4px; height: 5px; background: repeating-linear-gradient(135deg, var(--fg) 0 2px, transparent 2px 5px); }
.otab:hover { color: var(--fg); }
/* an order that arrived while the page was open */
.otab.is-new { border-color: var(--yellow); animation: newOrder 1.6s ease-in-out infinite; }
.otab .new-tag { margin-left: 4px; font: 700 9px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; padding: 3px 5px; background: var(--yellow); color: var(--yellow-ink); }
@keyframes newOrder { 50% { box-shadow: 0 0 0 3px rgba(255, 233, 0, .25); } }

/* ---------- several orders at once ---------- */
.cross { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--panel); }
.cross.v-all { border-left-color: var(--ok); }
.cross.v-none { border-left-color: var(--bad); }
.cross p { font-size: 14px; }
.xchips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.xchip { display: inline-flex; gap: 8px; align-items: baseline; padding: 4px 9px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--muted); font: 600 12px var(--ui); letter-spacing: .06em; text-transform: uppercase; }
.xchip b { font: 400 13px var(--mono); color: var(--fg); }
.xchip.pick { border-color: var(--yellow); color: var(--fg); }
.xchip:hover { border-color: var(--fg); }
@media (max-width: 640px) { .cross { grid-template-columns: 1fr; } }

/* ---------- order layout ---------- */
.order { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) 340px; grid-template-areas: "dir rail" "tabs rail"; align-items: start; }
.area-dir { grid-area: dir; min-width: 0; }
.area-rail { grid-area: rail; min-width: 0; display: grid; gap: 14px; position: sticky; top: 86px; }
.area-tabs { grid-area: tabs; min-width: 0; display: grid; gap: 0; scroll-margin-top: 96px; }
.sim { scroll-margin-top: 96px; }
@media (max-width: 980px) {
  .order { grid-template-columns: minmax(0, 1fr); grid-template-areas: "dir" "rail" "tabs"; }
  .area-rail { position: static; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
}
.order.anim .directive { animation: rise .5s var(--ease) both; }
.order.anim .area-rail > * { animation: rise .5s var(--ease) both; animation-delay: .06s; }
.order.anim .area-rail > *:nth-child(2) { animation-delay: .12s; }
.order.anim .area-rail > *:nth-child(3) { animation-delay: .18s; }
.order.anim .tabbar { animation: rise .5s var(--ease) both; animation-delay: .1s; }

/* ---------- directive hero ---------- */
.area-dir { container-type: inline-size; }
.directive {
  padding: 22px 26px 22px 30px; overflow: hidden; border-color: var(--line-2); min-height: 300px;
  display: grid; gap: 14px 28px; align-content: start;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "head" "title" "why" "meter" "actions";
}
.directive.has-globe { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "head head" "title globe" "why globe" "meter globe" "actions globe"; }
.dir-head { grid-area: head; } .dir-title { grid-area: title; min-width: 0; } .why { grid-area: why; }
.directive .dir-meter, .directive .dir-done { grid-area: meter; } .dir-actions { grid-area: actions; }
.directive::selection { background: var(--yellow); }
.directive .glow { position: absolute; right: -120px; top: -120px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--fc, var(--yellow)) 26%, transparent), transparent 65%); pointer-events: none; }
@keyframes orbit { to { transform: rotate(360deg); } }

/* globe: the target planet with the objective's progress as an orbit ring */
.globe { grid-area: globe; position: relative; width: 214px; aspect-ratio: 1; align-self: center; justify-self: end; margin: -6px -4px 0 0; }
.globe svg { display: block; width: 100%; height: 100%; overflow: visible; }
.globe .g-s0 { stop-color: color-mix(in srgb, var(--fc, var(--yellow)) 78%, #fff); }
.globe .g-s1 { stop-color: color-mix(in srgb, var(--fc, var(--yellow)) 62%, #0a0f24); }
.globe .g-s2 { stop-color: color-mix(in srgb, var(--fc, var(--yellow)) 18%, #02040c); }
.globe .g-a0 { stop-color: var(--fc, var(--yellow)); stop-opacity: 0; }
.globe .g-a1 { stop-color: var(--fc, var(--yellow)); stop-opacity: .38; }
.globe .g-ticks { fill: none; stroke: var(--line-2); stroke-width: 5; stroke-dasharray: 1.1 6.4; opacity: .8; }
.globe .g-track { fill: none; stroke: var(--panel-3); stroke-width: 7; }
.globe .g-arc { fill: none; stroke: var(--f-human); stroke-width: 7; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 1.4s var(--ease); filter: drop-shadow(0 0 5px rgba(107, 183, 234, .7)); }
.globe.cnt .g-arc { stroke: var(--yellow); filter: drop-shadow(0 0 5px rgba(255, 233, 0, .55)); }
.globe .g-surf { animation: drift 46s linear infinite; }
.globe .g-surf .d { fill: rgba(0, 0, 0, .28); }
.globe .g-surf .l { fill: rgba(255, 255, 255, .10); }
@keyframes drift { to { transform: translateX(-156px); } }
.globe .g-sat { fill: var(--info); transform-origin: 120px 120px; animation: orbit 26s linear infinite; filter: drop-shadow(0 0 4px var(--info)); }
.globe .g-sat.hod { fill: var(--yellow); filter: drop-shadow(0 0 6px var(--yellow)); }
.g-val { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 3px; text-align: center; pointer-events: none; }
.g-val b { font: 400 32px/1 var(--mono); color: #fff; text-shadow: 0 1px 10px rgba(0, 0, 0, .95), 0 0 2px #000; }
.g-val span { font: 600 10px/1 var(--ui); letter-spacing: .18em; text-transform: uppercase; color: rgba(255, 255, 255, .88); text-shadow: 0 1px 6px #000; }
.g-val i { margin-top: 4px; font: 600 9px/1 var(--ui); font-style: normal; letter-spacing: .14em; text-transform: uppercase; color: var(--info); padding: 3px 5px; border: 1px solid currentColor; background: rgba(0, 5, 20, .7); }
@container (max-width: 760px) { .globe { width: 160px; } .g-val b { font-size: 26px; } }
@container (max-width: 580px) {
  .directive.has-globe { grid-template-areas: "head head" "title globe" "why why" "meter meter" "actions actions"; column-gap: 12px; }
  .globe { width: 96px; margin: 0 -6px 0 0; align-self: end; }
  .globe .g-ticks { display: none; }
  .g-val b { font-size: 19px; }
  .g-val span { font-size: 7px; letter-spacing: .12em; }
  .g-val i { display: none; }
}
@container (max-width: 300px) { .globe { display: none; } .directive.has-globe { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "title" "why" "meter" "actions"; } }
@supports not (container-type: inline-size) {
  .directive.has-globe { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "title" "why" "meter" "actions"; }
  .globe { display: none; }
}
.dir-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; position: relative; }
.dir-head .label { color: var(--yellow); display: flex; align-items: center; gap: 8px; }
.fchip { font: 600 11px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; padding: 5px 8px; border: 1px solid var(--fc, var(--line-2)); color: var(--fc, var(--muted)); background: color-mix(in srgb, var(--fc, transparent) 10%, transparent); }
.kicker { position: relative; font: 700 16px/1.1 var(--display); font-stretch: 125%; letter-spacing: .14em; color: var(--yellow); text-transform: uppercase; }
.target { position: relative; font: 400 clamp(44px, 7.4vw, 92px)/.95 var(--stencil); letter-spacing: .02em; text-transform: uppercase; color: var(--fg); overflow-wrap: normal; text-shadow: 0 0 30px color-mix(in srgb, var(--fc, var(--yellow)) 25%, transparent); }
.target.long { font-size: clamp(34px, 5.2vw, 62px); }
.target .ch.scr { color: var(--yellow); }
.why { position: relative; font: 500 17px/1.5 var(--ui); max-width: 58ch; color: var(--fg); }
.dir-meter { position: relative; display: grid; gap: 8px; margin-top: 4px; max-width: 620px; }
.dir-meter .cap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: 14px; color: var(--muted); }
.dir-meter .cap b { color: var(--fg); font-weight: 600; }
.pips { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; }
.pip { height: 22px; transform: skewX(-18deg); background: var(--panel-3); border: 1px solid var(--line); }
.pip.on { background: var(--yellow); border-color: var(--yellow); }
.pip.on.ok { background: var(--ok); border-color: var(--ok); }
.pip.need { border-color: var(--yellow); }
.anim .pip.on { animation: pipIn .45s var(--ease) both; animation-delay: calc(var(--i) * 28ms); }
@keyframes pipIn { from { opacity: 0; transform: skewX(-18deg) translateY(8px); } }
.dir-actions { position: relative; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; background: transparent; border: 1px solid var(--line-2); color: var(--fg);
  font: 600 13px var(--ui); letter-spacing: .1em; text-transform: uppercase; transition: border-color .2s, background .2s, transform .15s;
}
.btn:hover { border-color: var(--yellow); background: rgba(255, 233, 0, .06); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--yellow); color: var(--yellow-ink); border-color: var(--yellow); }
.btn.primary:hover { background: #fff36b; }
.btn.ghostly { border-color: transparent; color: var(--muted); padding-inline: 10px; }
.btn.ghostly:hover { color: var(--fg); border-color: var(--line-2); background: transparent; }
.btn.ghostly.done { color: var(--ok); }
.btn .ico { width: 13px; height: 13px; }
.dir-done { display: flex; align-items: center; gap: 14px; position: relative; }
.big-check { width: 64px; height: 64px; border: 3px solid var(--ok); display: grid; place-items: center; color: var(--ok); }


/* ---------- rail ---------- */
.rail-card { padding: 16px 18px; display: grid; gap: 10px; }
.verdict-card { text-align: left; }
.stamp { justify-self: start; font: 400 26px/1.05 var(--stencil); text-transform: uppercase; letter-spacing: .04em; padding: 8px 14px 6px; border: 3px solid currentColor; transform: rotate(-2.5deg); }
.stamp.slam { animation: slam .55s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes slam { 0% { transform: rotate(-12deg) scale(2.2); opacity: 0; } 60% { opacity: 1; } 100% { transform: rotate(-2.5deg) scale(1); } }
.verdict-card .meaning { color: var(--fg); font-size: 15px; }
.verdict-card.alert { background: linear-gradient(rgba(58, 9, 5, .92), rgba(40, 6, 4, .92)); border-color: var(--alert-line); }
.verdict-card.alert .meaning { color: var(--alert-fg); }
.timer .count { font: 400 34px/1 var(--mono); letter-spacing: .03em; color: var(--fg); transition: color .4s; }
.timer .count span { color: var(--dim); font-size: 18px; margin: 0 4px 0 1px; }
.timer.soon .count { color: var(--warn); }
.timer.urgent .count { color: var(--bad); animation: tense 2s ease-in-out infinite; }
@keyframes tense { 50% { opacity: .72; } }
.timer .until { font-size: 13px; color: var(--muted); }
.reward { display: flex; align-items: center; gap: 10px; font: 600 15px var(--ui); white-space: nowrap; }
.medal { width: 26px; height: 26px; flex: 0 0 auto; }
.brief-card .text { color: var(--muted); font-size: 14px; max-height: 7.5em; overflow: hidden; position: relative; }
.brief-card .text.open { max-height: none; }
.brief-card .text:not(.open)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.2em; background: linear-gradient(transparent, var(--panel-solid)); }
.brief-card .text.short::after { display: none; }
.brief-card .text.short { color: var(--fg); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--yellow); font: 600 13px var(--ui); letter-spacing: .08em; text-transform: uppercase; justify-self: start; }
.linkbtn:hover { text-decoration: underline; }

/* ---------- sub tabs ---------- */
.tabbar { display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--line-2); min-width: 0; }
.keycap {
  flex: 0 0 auto; align-self: center; width: 26px; height: 24px; padding: 0; margin-bottom: 2px; display: grid; place-items: center;
  font: 700 12px/1 var(--mono); color: var(--muted); background: var(--panel-2); border: 1px solid var(--line-2); border-bottom-width: 3px; transition: color .2s, border-color .2s, transform .1s;
}
.keycap:hover { color: var(--fg); border-color: var(--fg); }
.keycap:active, .keycap.press { transform: translateY(2px); border-bottom-width: 1px; }
@media (hover: none), (pointer: coarse) { .keycap { display: none; } }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 0 1 auto; }
.tab {
  position: relative; flex: 0 0 auto; padding: 11px 34px 12px 16px; background: transparent; border: 1px solid var(--line-2); border-bottom: 0;
  color: var(--muted); font: 700 14px var(--display); font-stretch: 112%; letter-spacing: .1em; text-transform: uppercase; transition: color .2s, background .2s;
}
.tab .idx { position: absolute; right: 8px; bottom: 4px; font: 12px var(--mono); color: var(--dim); }
.tab[aria-selected="true"] { color: var(--fg); background: rgba(16, 32, 74, .85); border-color: var(--fg); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 26px; bottom: 4px; height: 5px; background: repeating-linear-gradient(135deg, var(--yellow) 0 2px, transparent 2px 5px); }
.tab:hover { color: var(--fg); }
.tabpanel { padding: 18px 0 0; display: grid; gap: 14px; }
.tabpanel.enter { animation: panelIn .35s var(--ease) both; }
@keyframes panelIn { from { opacity: 0; transform: translateY(8px); } }

/* ---------- objectives ---------- */
.objective {
  --fc: var(--line-2);
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px 14px; align-items: start;
  padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--fc);
  transition: background .2s, transform .2s;
}
.objective:hover { background: rgba(14, 28, 64, .92); }
.objective .check { width: 20px; height: 20px; border: 2px solid var(--line-2); display: grid; place-items: center; margin-top: 2px; }
.objective .check svg { width: 14px; height: 14px; }
.objective .check.done { border-color: var(--ok); background: var(--ok); color: var(--bg0); }
.objective .check.fail { border-color: var(--bad); color: var(--bad); }
.objective h4 { font: 700 17px/1.25 var(--display); font-stretch: 108%; letter-spacing: .02em; }
.objective .meta { grid-column: 2 / 4; display: grid; gap: 8px; }
.objective .line { font-size: 14px; color: var(--muted); }
.objective .line b { color: var(--fg); font-weight: 600; }
.chipline { display: flex; flex-wrap: wrap; gap: 6px; }
.anim .objective { animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
/* per-objective details */
.intel summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; font: 600 12px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding: 2px 0; }
.intel summary::-webkit-details-marker { display: none; }
.intel summary:hover { color: var(--fg); }
.intel summary .ico { transition: transform .2s var(--ease); }
.intel[open] summary { color: var(--muted); }
.intel[open] summary .ico { transform: rotate(180deg); }
.intel .kv { margin-top: 6px; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--line); gap: 6px 22px; }
.intel[open] .kv { animation: rise .25s var(--ease); }
.chip { font: 600 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; padding: 5px 7px; border: 1px solid currentColor; white-space: nowrap; }

/* bars */
.bar { position: relative; height: 12px; background: var(--panel-3); border: 1px solid var(--line); overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--yellow); transition: width 1.1s var(--ease); }
.bar .proj { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255, 233, 0, .45) 4px 8px); transition: left 1.1s var(--ease), width 1.1s var(--ease); }
.bar .goal { position: absolute; right: 0; top: -1px; bottom: -1px; width: 2px; background: var(--fg); }
.bar.lib { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--fc) 70%, transparent) 0 3px, color-mix(in srgb, var(--fc) 25%, transparent) 3px 6px); }
.bar.lib .fill { background: var(--f-human); box-shadow: 0 0 12px rgba(107, 183, 234, .5); }
/* advancing front line: a bright edge that flickers while we're gaining ground */
.bar.lib.moving .fill::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: #fff; box-shadow: 0 0 8px 2px rgba(190, 230, 255, .9); animation: edge 1.6s ease-in-out infinite; }
@keyframes edge { 50% { opacity: .35; } }
.bar.def .fill { background: var(--f-human); }

/* verdict colours */
.v-done, .v-ontrack { color: var(--ok); }
.v-effort, .v-focus { color: var(--info); }
.v-hard, .v-record { color: var(--warn); }
.v-nearly_impossible, .v-impossible, .v-failed { color: var(--bad); }
.v-unknown { color: var(--muted); }
.pill { font: 600 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; padding: 5px 8px; border: 1px solid currentColor; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.ico { width: 12px; height: 12px; display: inline-block; flex: 0 0 auto; }

/* hero tint when there's no faction */
.k-done { --fc: var(--ok); }
.k-lost { --fc: var(--bad); }
/* factions */
.fac-Terminids { --fc: var(--f-terminid); }
.fac-Automaton { --fc: var(--f-automaton); }
.fac-Illuminate { --fc: var(--f-illuminate); }
.fac-Humans { --fc: var(--f-human); }

/* ---------- strategy ---------- */
.the-plan { display: grid; gap: 8px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); }
.the-plan p { font-weight: 600; }
.moves { margin: 0; padding: 0; list-style: none; counter-reset: mv; display: grid; gap: 8px; }
.move { --lc: var(--line-2); counter-increment: mv; position: relative; display: grid; gap: 6px; padding: 14px 16px 14px 58px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--lc); }
.move::before { content: counter(mv); position: absolute; left: 14px; top: 14px; width: 30px; height: 30px; display: grid; place-items: center; font: 400 16px var(--mono); background: var(--lc); color: var(--bg0); }
.move.lvl-critical { --lc: var(--yellow); }
.move.lvl-high { --lc: var(--warn); }
.move.lvl-helps { --lc: var(--info); }
.move.lvl-tip { --lc: var(--line-2); }
.move.lvl-tip::before { background: transparent; color: var(--muted); border: 1px solid var(--line-2); }
.mv-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.mv-top h4 { font: 700 17px/1.25 var(--display); font-stretch: 108%; letter-spacing: .02em; }
.lvl { font: 700 10px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; padding: 4px 6px; border: 1px solid var(--lc); color: var(--lc); }
.mv-why { color: var(--fg); font-size: 15px; max-width: 75ch; }
.mv-fx { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.mv-fx .ico { color: var(--lc); }
.mv-fx span { color: var(--fg); font-weight: 600; }
.more-tips summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; font: 600 12px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 4px 0; }
.more-tips summary::-webkit-details-marker { display: none; }
.more-tips[open] summary .ico { transform: rotate(180deg); }
.more-tips .moves { margin-top: 8px; }
.moves.minor .move { padding-top: 10px; padding-bottom: 10px; }
.moves.minor .mv-why { font-size: 14px; color: var(--muted); }
.anim .move { animation: rise .4s var(--ease) both; }
.anim .move:nth-child(2) { animation-delay: .06s; } .anim .move:nth-child(3) { animation-delay: .12s; } .anim .move:nth-child(n+4) { animation-delay: .18s; }
@media (max-width: 640px) { .move { padding-left: 50px; } .move::before { left: 10px; width: 28px; height: 28px; } }
.plan { display: grid; gap: 10px; }
.sub-label { margin-top: 6px; }
.situation { padding: 14px 16px; border: 1px solid var(--alert-line); border-left: 3px solid var(--warn); background: linear-gradient(90deg, rgba(58, 9, 5, .55), rgba(5, 13, 34, .88)); display: grid; gap: 10px; }
.situation.k-bad { border-left-color: var(--bad); }
.situation .label { color: var(--alert-fg); }
.situation .head { font-weight: 600; font-size: 16px; color: var(--fg); }
.situation .detail { color: var(--muted); font-size: 14px; max-width: 75ch; }
.situation .k-bad .head { color: #ff8f88; }
.situation .k-warn .head { color: var(--warn); }
.fine { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.fine li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 9px 14px; background: rgba(5, 13, 34, .6); border: 1px solid var(--line); color: var(--muted); }
.fine .fi { width: 18px; height: 18px; margin-top: 1px; display: grid; place-items: center; border: 2px solid var(--ok); color: var(--ok); }
.fine .fi .ico { width: 11px; height: 11px; }
.fine .head { font-size: 14px; color: var(--fg); font-weight: 600; }
.fine .detail { font-size: 13px; }
.empty-moves { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--ok); }
.empty-moves .ico { width: 18px; height: 18px; }
.empty-moves span { color: var(--fg); }
.empty-moves.lost { color: var(--bad); }
.empty-moves.unknown { color: var(--muted); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 2px; }
.anim .steps li, .anim .fine li { animation: rise .4s var(--ease) both; }
.anim .steps li:nth-child(2) { animation-delay: .05s; } .anim .steps li:nth-child(3) { animation-delay: .1s; }
.anim .steps li:nth-child(4) { animation-delay: .15s; } .anim .steps li:nth-child(n+5) { animation-delay: .2s; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); }
.steps li::before { content: counter(step); font: 400 15px var(--mono); width: 28px; height: 28px; display: grid; place-items: center; background: var(--yellow); color: var(--yellow-ink); }
.steps li.minor::before { background: transparent; color: var(--muted); border: 1px solid var(--line-2); }
.steps .head { font-weight: 600; font-size: 16px; }
.steps .detail { color: var(--muted); font-size: 14px; max-width: 75ch; }
.steps .k-warn .head, .steps li.k-warn .head { color: var(--warn); }
.steps li.k-bad .head { color: var(--bad); }
.plan .nums { display: none; font: 13px var(--mono); color: var(--gold); margin-top: 4px; }
.plan.show-nums .nums { display: block; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px; }
.sec-head h3 { font: 700 20px var(--display); font-stretch: 118%; letter-spacing: .06em; text-transform: uppercase; }
.ghost { background: transparent; border: 1px solid var(--line-2); color: var(--muted); padding: 6px 10px; font: 600 12px var(--ui); letter-spacing: .1em; text-transform: uppercase; }
.ghost[aria-pressed="true"] { color: var(--fg); border-color: var(--yellow); }
.foot { font-size: 12px; color: var(--dim); }

.timeline { display: grid; gap: 8px; min-width: 0; }
.tl-track { position: relative; height: 34px; background: var(--panel-3); border: 1px solid var(--line); overflow: hidden; }
.tl-seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding: 0 8px; font: 700 12px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: #06102a; white-space: nowrap; overflow: hidden; border-right: 2px solid var(--bg0); background: var(--fc, var(--s1)); transform-origin: left; }
.anim .tl-seg { animation: grow .7s var(--ease) both; animation-delay: calc(var(--i) * 140ms); }
@keyframes grow { from { transform: scaleX(0); } }
.tl-seg.late { background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgba(255, 81, 72, .55) 5px 10px); }
.tl-deadline { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--bad); box-shadow: 0 0 8px var(--bad); }
.tl-list { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); }
.tl-list b { color: var(--fg); font-weight: 600; }
.sw2 { width: 10px; height: 10px; display: inline-block; margin-right: 6px; vertical-align: middle; background: var(--fc); }

/* simulator */
.sim { padding: 18px 20px; display: grid; gap: 14px; }
.sim .q { font: 600 16px var(--ui); }
.range-wrap { position: relative; padding-top: 18px; }
.range-now { position: absolute; top: 0; transform: translateX(-50%); font: 11px var(--mono); color: var(--info); white-space: nowrap; }
.range-now::after { content: ""; position: absolute; left: 50%; top: 14px; width: 1px; height: 10px; background: var(--info); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; background: linear-gradient(to right, var(--yellow) var(--p, 50%), var(--panel-3) var(--p, 50%)); border: 1px solid var(--line-2); }
input[type="range"]::-moz-range-track { height: 8px; background: var(--panel-3); border: 1px solid var(--line-2); }
input[type="range"]::-moz-range-progress { height: 8px; background: var(--yellow); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 26px; margin-top: -10px; background: var(--fg); border: 2px solid var(--bg0); clip-path: polygon(50% 0, 100% 30%, 100% 100%, 0 100%, 0 30%); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 24px; background: var(--fg); border: 2px solid var(--bg0); border-radius: 0; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.sim-out { display: grid; gap: 8px; padding: 14px 16px; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid currentColor; }
.sim-out .big { font: 700 22px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; }
.sim-out .sub { color: var(--muted); font-size: 14px; }
.sim-tasks { display: grid; gap: 10px; }
.sim-task { display: grid; gap: 4px; }
.sim-task .row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }

/* ---------- data tab ---------- */
.gauge { display: grid; gap: 8px; }
.gauge-track { position: relative; height: 34px; background: var(--panel-3); border: 1px solid var(--line); }
.gauge-fill { position: absolute; inset: 0 auto 0 0; background: var(--info); opacity: .9; transition: width 1.1s var(--ease); }
.gauge-mark { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--fg); }
.gauge-mark.need { background: var(--yellow); }
.gauge-mark.record { background: var(--muted); width: 1px; }
.gauge-mark.full { background: var(--bad); width: 1px; }
.gauge-scale { position: relative; height: 16px; font: 11px var(--mono); color: var(--dim); }
.gauge-scale span { position: absolute; transform: translateX(-50%); }
.gauge-legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--muted); }
.gauge-legend span { display: inline-flex; align-items: center; gap: 6px; }
.gauge-legend b { color: var(--fg); }
.sw { width: 12px; height: 12px; display: inline-block; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.fact { border-left: 3px solid var(--line-2); padding: 2px 0 2px 10px; }
.fact .big { font: 400 24px var(--mono); }
.fact.key { border-left-color: var(--yellow); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font: 600 11px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: var(--panel-2); }
td.num { font-family: var(--mono); }
tr:last-child td { border-bottom: 0; }
.tag { font-size: 11px; color: var(--dim); font-family: var(--ui); }
.kv { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 14px; color: var(--muted); }
.kv b { font-family: var(--mono); font-weight: 400; color: var(--fg); }
.note { font-size: 13px; color: var(--muted); max-width: 75ch; }
.dblock { padding: 14px 16px; display: grid; gap: 8px; }
.dblock h4 { font: 700 16px var(--display); font-stretch: 108%; }

/* ---------- errors, empty, dialogs, footer ---------- */
.err { border: 1px solid var(--alert-line); color: var(--alert-fg); padding: 12px 16px; background: rgba(58, 9, 5, .92); }
.err .help { color: var(--fg); margin-top: 8px; }
.err .help p { margin: 0 0 6px; }
.err .help ol { margin: 0; padding-left: 20px; color: var(--muted); display: grid; gap: 4px; }
.err .help a { color: var(--yellow); word-break: break-all; }
.err .tech { margin-top: 8px; color: var(--muted); }
.err .tech summary { cursor: pointer; font-size: 13px; }
.err .tech pre { white-space: pre-wrap; word-break: break-word; font: 12px var(--mono); max-height: 240px; overflow: auto; }
.empty { padding: 56px 20px; text-align: center; color: var(--muted); display: grid; justify-items: center; gap: 14px; font-size: 16px; }
.empty-ico { color: var(--yellow); animation: orbit 12s linear infinite; }
.skeleton { display: grid; gap: 14px; }
.sk-note { font: 14px var(--mono); color: var(--gold); }
.sk-note:not(:empty)::before { content: "> "; }
.dblock-title { display: grid; gap: 2px; margin-top: 6px; }
.dblock-title h4 { font: 700 16px var(--display); font-stretch: 108%; }
kbd { font: 600 12px var(--mono); padding: 1px 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; background: var(--panel-2); color: var(--fg); }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  max-width: calc(100% - 32px); padding: 10px 16px; background: var(--panel-solid); border: 1px solid var(--yellow); color: var(--fg); font: 600 14px var(--ui);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5); transition: opacity .25s, transform .25s var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.sk { background: linear-gradient(90deg, var(--panel-2) 0%, var(--panel-3) 50%, var(--panel-2) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; border: 1px solid var(--line); }
@keyframes shimmer { to { background-position: -200% 0; } }
dialog { background: var(--panel-solid); color: var(--fg); border: 1px solid var(--line-2); padding: 0; width: min(680px, calc(100% - 32px)); max-height: calc(100% - 48px); }
dialog::backdrop { background: rgba(0, 3, 12, .72); backdrop-filter: blur(2px); }
dialog[open] { animation: dlgIn .25s var(--ease); }
@keyframes dlgIn { from { opacity: 0; transform: translateY(10px); } }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel-solid); }
.dlg-head h2 { font: 700 18px var(--display); font-stretch: 118%; letter-spacing: .08em; text-transform: uppercase; }
.dlg-body { padding: 16px 18px 20px; display: grid; gap: 14px; }
.dlg-body p, .dlg-body dd { color: var(--muted); }
.dlg-body dt { font-weight: 600; margin-top: 6px; }
.dlg-body dd { margin: 0; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.settings label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.settings input, .settings select { background: var(--panel-2); border: 1px solid var(--line-2); padding: 8px 10px; color: var(--fg); }
footer { font-size: 12px; color: var(--dim); max-width: 1240px; margin: 0 auto; }

/* ---------- boot overlay ---------- */
.boot { position: fixed; inset: 0; z-index: 100; background: var(--bg0); display: grid; place-items: center; padding: 24px; transition: opacity .5s, visibility .5s; }
.boot.out { opacity: 0; visibility: hidden; }
.boot-in { width: min(560px, 100%); display: grid; gap: 14px; }
.boot .logo { font-size: clamp(44px, 9vw, 72px); }
.boot pre { margin: 0; font: 15px/1.7 var(--mono); color: var(--gold); white-space: pre-wrap; min-height: 8.5em; }
.boot pre .ok { color: var(--ok); }
.boot pre .pending { color: var(--warn); }
.caret { display: inline-block; width: 9px; height: 1em; background: var(--yellow); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.boot .skip { justify-self: start; }
.boot-bar { height: 4px; background: var(--panel-3); overflow: hidden; }
.boot-bar i { display: block; height: 100%; width: 40%; background: var(--yellow); animation: load 1.2s var(--ease) infinite; }
@keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

@media (max-width: 640px) {
  .logo { font-size: 24px; }
  .brand .sub { display: none; }
  .hud-stats { order: 3; width: 100%; display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 6px 10px; align-items: end; }
  .hud-in { row-gap: 8px; }
  .hud-actions { gap: 6px; }
  .icon-btn, .hud select { height: 34px; min-width: 34px; padding: 0 8px; }
  .ring-btn { width: 34px; }
  .ring-btn svg { inset: 2px; }
  .stat .label { font-size: 10px; letter-spacing: .1em; }
  .stat .v { font-size: 15px; }
  .stat .v small { display: none; }
  .directive { padding: 18px 16px 18px 28px; min-height: 0; }
  .directive .hatch-rail.l { left: 9px; }
  .area-rail { grid-template-columns: 1fr 1fr; gap: 10px; }
  .verdict-card { grid-column: 1 / -1; }
  .stamp { font-size: 21px; }
  .timer { grid-column: 1 / -1; grid-template-columns: 1fr auto; align-items: end; }
