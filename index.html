<body>
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot-in">
    <div class="logo"><span class="l1">Ministry of</span><b>VICTORY</b></div>
    <pre id="boot-log"></pre>
    <div class="boot-bar"><i></i></div>
    <button type="button" class="ghost skip" id="boot-skip"></button>
  </div>
</div>

<div class="app">
  <header class="hud">
    <div class="hud-in">
      <div class="brand">
        <svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 38 20 20 38 2 20Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 8 32 20 20 32 8 20Z" fill="currentColor" opacity=".18"/><path d="M13 17h14l-2.4 4H22v7h-4v-7h-2.6Z" fill="currentColor"/></svg>
        <div class="logo" aria-label="Ministry of Victory"><span class="l1">Ministry of</span><b>VICTORY</b></div>
        <span class="sub" id="tagline"></span>
      </div>
      <div class="hud-stats" id="hud-stats" aria-live="polite"></div>
      <div class="hud-actions">
        <button type="button" class="icon-btn ring-btn" id="refresh">
          <svg viewBox="0 0 28 28" aria-hidden="true"><circle class="track" cx="14" cy="14" r="12"/><circle class="prog" id="ring" cx="14" cy="14" r="12"/></svg>
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.1 5.6A4.6 4.6 0 1 0 12.6 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12.6 2.9v2.9H9.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="hb-l" id="l-refresh"></span>
        </button>
        <button type="button" class="icon-btn hb" id="open-info"><span class="q" aria-hidden="true">?</span><span class="hb-l" id="l-info"></span></button>
        <button type="button" class="icon-btn hb" id="open-settings">
          <svg class="ico" style="width:16px;height:16px" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Zm6 3.5V7.3l-1.6-.4-.5-1.2.9-1.4-1-1-1.4.9-1.2-.5L8.7 2H7.3l-.4 1.6-1.2.5-1.4-.9-1 1 .9 1.4-.5 1.2L2 7.3v1.4l1.6.4.5 1.2-.9 1.4 1 1 1.4-.9 1.2.5.4 1.6h1.4l.4-1.6 1.2-.5 1.4.9 1-1-.9-1.4.5-1.2Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          <span class="hb-l" id="l-settings"></span>
        </button>
      </div>
    </div>
  </header>

  <div class="shell">
    <nav class="order-tabs" id="order-tabs" role="tablist"></nav>
    <div id="cross"></div>
    <div id="intel" hidden></div>
    <div id="errors"></div>
    <div id="stale"></div>
    <main id="view">
      <div class="skeleton" id="skeleton">
        <p class="sk-note" id="sk-note"></p>
        <div class="sk" style="height:300px"></div>
        <div class="sk" style="height:46px"></div>
        <div class="sk" style="height:120px"></div>
      </div>
    </main>
    <footer id="footer"></footer>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg-settings" aria-labelledby="settings-title">
  <div class="dlg-head"><h2 id="settings-title"></h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></div>
  <div class="dlg-body">
    <div class="settings">
      <label><span id="l-cap"></span>
        <select id="s-capmode"><option value="auto"></option><option value="manual"></option></select>
      </label>
      <label><span id="l-capval"></span><input id="s-cap" type="number" min="20000" max="300000" step="1000"></label>
      <label><span id="l-dss"></span><input id="s-dss" type="number" min="0" max="1" step="0.01"></label>
      <label><span id="l-hod"></span><input id="s-hod" type="number" min="1" max="3" step="0.05"></label>
      <label><span id="l-rec"></span><input id="s-rec" type="number" min="0.3" max="1" step="0.01"></label>
      <label><span id="l-contact"></span><input id="s-contact" type="text" maxlength="80"></label>
      <label><span id="l-motion"></span>
        <select id="s-motion"><option value="full"></option><option value="reduced"></option></select>
      </label>
    </div>
  </div>
</dialog>

<dialog id="dlg-info" aria-labelledby="info-title">
  <div class="dlg-head"><h2 id="info-title"></h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></div>
  <div class="dlg-body" id="explain"></div>
</dialog>
<script>
const GAME={env:{acid_storms:{n:"Acid Storms",d:"Corrosive acid storms temporarily reduce armor effectiveness for both enemy and friendly units."},blizzards:{n:"Blizzards",d:"Intense blizzard reduce mobility and moderately reduce visibility for both enemy and friendly units."},extreme_cold:{n:"Extreme Cold",d:"Icy temperatures reduce rate of fire and delay heat buildup in weapons."},fire_tornadoes:{n:"Fire Tornadoes",d:"Planet is ravaged by deadly fire tornadoes."},intense_heat:{n:"Intense Heat",d:"High temperatures increase stamina drain and speed up heat buildup in weapons."},ion_storms:{n:"Ion Storms",d:"Ion storms intermittently disable Stratagems."},meteor_storms:{n:"Meteor Storms",d:"Meteors impact the surface causing massive damage."},none:{n:"None",d:"This planet's environment is not yet known, or has no environmental modifiers."},normal_temp:{n:"Normal Temperature",d:"Average temperatures convey no significant change to weapons or stamina."},rainstorms:{n:"Rainstorms",d:"Torrential rainstorms reduce visibility."},sandstorms:{n:"Sandstorms",d:"Dense sandstorms reduce mobility and greatly reduce visibility for both enemy and friendly units."},thick_fog:{n:"Thick Fog",d:"Dense fog lightly reduce visibility for both enemy and friendly units."},tremors:{n:"Tremors",d:"Frequent earthquakes stun players and enemies alike."},volcanic_activity:{n:"Volcanic Activity",d:"Volcanoes throw burning rocks around this planet."}},bio:{arctic_glacier_base:{n:"Icy Glaciers",d:"Submerged in eternal winter, this world's frosty peaks glimmer in the light of its too-distant star."},arctic_glacier_coldrocky:{n:"Boneyard",d:"Ice and moss-covered rock can be found across most of the surface of this planet."},arctic_glacier_tien_kwan:{n:"Tien Kwan Special",d:"Ice and moss-covered rock can be found across most of the surface of this planet."},blackhole:{n:"Black Hole",d:"The planet is gone, the ultimate price to pay in the war for humanity's survival."},bug_hiveworld:{n:"Hive World",d: ner than forecast (events, Super Earth help).",kMeasured:"measured on the planets being fought over right now",kRecent:"measured on your last visit",kRecord:"measured by the site's recorder in the last hours",kDefault:"measured on 28 October 2026",gaugeTitle:"Share of the playerbase",gNow:"Now on MO planets",gNeed:"Needed (one planet at a time)",gRecord:"All-time record",gFull:"100% = everyone",fNow:"Now on MO planets",fNeed:"Needed, one planet at a time",fPar:"Needed, all at once",fAtNow:"Current share, well coordinated",of:"of",never:"never",th:{planet:"Planet",hp:"Enemy HP",regen:"Regen/h",divers:"Helldivers",be:"Break-even",net:"Net/h",eta:"Est. finish"},obs:"measured",model:"estimated",regions:"regions included",done:"Done",needRate:"Needed pace",rateStart:"Average pace since start",rateRecent:"Pace, last hour",proj:"Projection at the end",perHour:"/h",waitData:"Keep the page open for a few minutes to measure the pace.",startUnknown:"Order start time unavailable: using only the pace measured by this page.",lowConf:"Measured over less than 12 hours: the pace changes a lot between day and night.",defEnds:"Ends in",defNeed:"Needs",defOutlasts:"The attack ends after the MO: the planet still counts as ours at the deadline.",kill:"Kill",with:"with",item:"item",enemy:"enemy",extract:"Successfully extract with",samples:"samples",objectives:"Complete {n} objectives",missions:"Complete {n} missions",operations:"Complete {n} operations",play:"Play {n} missions",use:"Use {item} {n} times",donate:"Donate {n} {item}",resources:"resources",extractN:"Complete {n} successful extractions",liberate:"Liberate {p}",hold:"Hold {p} when the order ends",defendN:"Defend against {n} attacks",liberateN:"Liberate {n} planets",liberateNf:"Liberate {n} {f} planets",net:"Liberate more planets than are lost",on:"on",enemies:"enemies",minDiff:"difficulty {d}+",tgtSamples:"Samples",tgtOps:"Operations",tgtMissions:"Missions",tgtEnemies:"Enemies",tgtExtractions:"Extractions",tgtObjectives:"Object <p>How much each player is worth changes all the time: the game weighs every mission by the war's <b>impact multiplier</b>, which drops when more people are playing. The page reads it live from the API, so the numbers follow the current Major Order and the current playerbase, not a fixed reference. The damage constant that turns players into HP is measured by the page itself on the planets being fought over, and saved for your next visit.</p>
<dl>
<dt>Command log</dt><dd>Hand-made changes by Super Earth Command or a scripted enemy push: a planet that jumps or drops far more than its Helldivers explain, enemy resistance changed, a new attack, objectives edited. Also the latest Super Earth news. The war is recorded every 10 minutes even while nobody has the page open, so this covers everything since the start of the running orders (from 28 October 2026 on).</dd>
<dt>What to do now</dt><dd>The single move that changes the Major Order's outcome the most right now. The full list of moves is in the Plan tab.</dd>
<dt>Forecast</dt><dd>The bars under the stamp show why: what we do against what each objective needs, and how many times faster it would have to go. How realistic victory is: from "On track" (we make it as things are) to "Impossible" (not even with every player online).</dd>
<dt>Progress</dt><dd>How the order got here: progress since it began, the pace it needs, where today's pace leads, and the pace hour by hour. Hover or tap a chart to read any moment, tap the legend to hide a line.</dd>
<dt>What if\u2026?</dt><dd>Drag the slider to see what would happen with more or fewer players focused on the order.</dd>
<dt>Kills, samples, operations</dt><dd>The page compares the pace needed with the pace of the last 24 hours (a full day and night, recorded by the site), or the average since the order started until a day has been recorded, and shows the last hour too.</dd>
<dt>Option orders</dt><dd>Some orders say Option 1, Option 2: any one of them wins. The forecast and the plan then follow the most winnable option.</dd>
<dt>All active orders</dt><dd>When more than one order is running, the bar above shows what share of everyone online each one needs, counting players who help two orders at once (killing bots on a bot planet counts for both), and which order is the best bet if there aren't enough players for all of them.</dd>
<dt>Regions</dt><dd>Planets with regions are taken one region at a time, quickest first. While regions are being captured, the planet's own regen keeps eating into the damage already done, so splitting players across regions slows everything down.</dd>
<dt>New orders</dt><dd>The page checks the API every minute. When Super Earth issues a new Major Order, or changes the current one, everything on the page is worked out again from the new objectives.</dd>
<dt>Copy for Discord</dt><dd>Copies the order of the day as text ready to paste on Discord, Reddit or in chat.</dd>
<dt>Shortcuts</dt><dd><kbd>Q</kbd> and <kbd>E</kbd> switch tab, <kbd>1</kbd> to <kbd>4</kbd> open a tab, <kbd>R</kbd> refreshes, <kbd>?</kbd> opens this guide.</dd>
</dl>
<p>Limits: the exact effect of the DSS and Heavy Ordnance isn't public, the region capture bonus and how planet regen works against it are estimated, weapon-only kill counts can't be turned into a number of players, and the Game Master can change regen at any time.</p>`;
