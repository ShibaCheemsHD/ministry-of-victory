<body>
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot-in">
    <div class="logo"><span class="l1">Ministry of</span><b>VICTORY</b></div>
    <pre id="boot-log"></pre>
    <div class="boot-bar"><i></i></div>
    <button type="button" class="ghost skip" id="boot-skip"></button>
  </div>
</div>

<div class="app">
  <header class="hud">
    <div class="hud-in">
      <div class="brand">
        <svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 38 20 20 38 2 20Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 8 32 20 20 32 8 20Z" fill="currentColor" opacity=".18"/><path d="M13 17h14l-2.4 4H22v7h-4v-7h-2.6Z" fill="currentColor"/></svg>
        <h1 class="logo" aria-label="Ministry of Victory"><span class="l1">Ministry of</span><b>VICTORY</b></h1>
        <span class="sub" id="tagline"></span>
      </div>
      <div class="hud-stats" id="hud-stats" aria-live="polite"></div>
      <div class="hud-actions">
        <button type="button" class="icon-btn ring-btn" id="refresh">
          <svg viewBox="0 0 28 28" aria-hidden="true"><circle class="track" cx="14" cy="14" r="12"/><circle class="prog" id="ring" cx="14" cy="14" r="12"/></svg>
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.1 5.6A4.6 4.6 0 1 0 12.6 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12.6 2.9v2.9H9.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="hb-l" id="l-refresh"></span>
        </button>
        <button type="button" class="icon-btn hb" id="open-archive" aria-pressed="false"><svg class="ico" style="width:15px;height:15px" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v3H2zM3 6v7h10V6M6.5 8.5h3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="hb-l" id="l-archive"></span></button>
        <button type="button" class="icon-btn hb" id="open-info"><span class="q" aria-hidden="true">?</span><span class="hb-l" id="l-info"></span></button>
        <button type="button" class="icon-btn hb" id="open-settings">
          <svg class="ico" style="width:16px;height:16px" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Zm6 3.5V7.3l-1.6-.4-.5-1.2.9-1.4-1-1-1.4.9-1.2-.5L8.7 2H7.3l-.4 1.6-1.2.5-1.4-.9-1 1 .9 1.4-.5 1.2L2 7.3v1.4l1.6.4.5 1.2-.9 1.4 1 1 1.4-.9 1.2.5.4 1.6h1.4l.4-1.6 1.2-.5 1.4.9 1-1-.9-1.4.5-1.2Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          <span class="hb-l" id="l-settings"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="shell" id="main">
    <nav class="ot-nav" id="ot-nav" aria-label="Orders"><div class="order-tabs" id="order-tabs" role="tablist"></div></nav>
    <div id="cross"></div>
    <div id="intel" hidden></div>
    <div id="errors"></div>
    <div id="stale"></div>
    <div id="view">
      <div class="skeleton" id="skeleton">
        <p class="sk-note" id="sk-note"></p>
        <div class="sk" style="height:300px"></div>
        <div class="sk" style="height:46px"></div>
        <div class="sk" style="height:120px"></div>
      </div>
    </div>
    <footer id="footer"></footer>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg-settings" aria-labelledby="settings-title">
  <div class="dlg-head"><h2 id="settings-title"></h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></div>
  <div class="dlg-body">
    <div class="settings">
      <label><span id="l-lang"></span>
        <select id="s-lang"><option value="en" lang="en">English</option><option value="it" lang="it">Italiano</option></select>
      </label>
      <label><span id="l-cap"></span>
        <select id="s-capmode"><option value="auto"></option><option value="manual"></option></select>
      </label>
      <label><span id="l-capval"></span><input id="s-cap" type="number" min="20000" max="300000" step="1000"></label>
      <label><span id="l-dss"></span><input id="s-dss" type="number" min="0" max="1" step="0.01"></label>
      <label><span id="l-hod"></span><input id="s-hod" type="number" min="1" max="3" step="0.05"></label>
      <label><span id="l-rec"></span><input id="s-rec" type="number" min="0.3" max="1" step="0.01"></label>
      <label><span id="l-contact"></span><input id="s-contact" type="text" maxlength="80"></label>
      <label><span id="l-motion"></span>
        <select id="s-motion"><option value="full"></option><option value="reduced"></option></select>
      </label>
    </div>
  </div>
</dialog>

<dialog id="dlg-share" aria-labelledby="share-title">
  <div class="dlg-head"><h2 id="share-title"></h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></div>
  <div class="dlg-body" id="share-body"></div>
</dialog>

<dialog id="dlg-info" aria-labelledby="info-title">
  <div class="dlg-head"><h2 id="info-title"></h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></div>
  <div class="dlg-body" id="explain"></div>
</dialog>
<script>
const GAME={env:{acid_storms:{n:"Acid Storms",d:"Corrosive acid storms temporarily reduce armor effectiveness for both enemy and friendly units."},blizzards:{n:"Blizzards",d:"Intense blizzard reduce mobility and moderately reduce visibility for both enemy and friendly units."},extreme_cold:{n:"Extreme Cold",d:"Icy temperatures reduce rate of fire and delay heat buildup in weapons."},fire_tornadoes:{n:"Fire Tornadoes",d:"Planet is ravaged by deadly fire tornadoes."},intense_heat:{n:"Intense Heat",d:"High temperatures increase stamina drain and speed up heat buildup in weapons."},ion_storms:{n:"Ion Storms",d:"Ion storms intermittently disable Stratagems."},meteor_storms:{n:"Meteor Storms",d:"Meteors impact the surface causing massive damage."},none:{n:"None",d:"This planet's environment is not yet known, or has no environmental modifiers."},normal_temp:{n:"Normal Temperature",d:"Average temperatures convey no significant change to weapons or stamina."},rainstorms:{n:"Rainstorms",d:"Torrential rainstorms reduce visibility."},sandstorms:{n:"Sandstorms",d:"Dense sandstorms reduce mobility and greatly reduce visibility for both enemy and friendly units."},thick_fog:{n:"Thick Fog",d:"Dense fog lightly reduce visibility for both enemy and friendly units."},tremors:{n:"Tremors",d:"Frequent earthquakes stun players and enemies alike."},volcanic_activity:{n:"Volcanic Activity",d:"Volcanoes throw burning rocks around this planet."}},bio:{arctic_glacier_base:{n:"Icy Glaciers",d:"Submerged in eternal winter, this world's frosty peaks glimmer in the light of its too-distant star."},arctic_glacier_coldrocky:{n:"Boneyard",d:"Ice and moss-covered rock can be found across most of the surface of this planet."},arctic_glacier_tien_kwan:{n:"Tien Kwan Special",d:"Ice and moss-covered rock can be found across most of the surface of this planet."},blackhole:{n:"Black Hole",d:"The planet is gone, the ultimate price to pay in the war for humanity's survival."},bug_hiveworld:{n:"Hive World",d:"This planet has been completely infested by the Terminids, transformed inside and out into a hive of Tyranny."},cyberstan:{n:"Cyberstan Megafactory",d:"Cyberstan, once again, forms the axis of the Cyborg Legion's insurrection. Massive Megafactories cover its surface, churning out mechanical armies and weapons of mass extinction."},deciduous_autumn:{n:"Deciduous Autumn Forest",d:"Broadleaf woodlands spread across rolling hills, broken by shallow waters that wind through mossy logs, flowers, and stone. (UNOFFICIAL)"},deciduous_base:{n:"Deciduous Forest",d:"Broadleaf woodlands spread across rolling hills, broken by shallow waters that wind through mossy logs, flowers, and stone. (UNOFFICIAL)"},deciduous_crimson:{n:"Deciduous Crimson Forest",d:"Description pending"},deciduous_fall:{n:"Deciduous Autumn Forest",d:"Broadleaf woodlands spread across rolling hills, broken by shallow waters that wind through mossy logs, flowers, and stone. (UNOFFICIAL)"},magma_base:{n:"Magma",d:"Constant eruptions keep this planet covered in lava flows and utterly inhospitable to Democratic life. It also makes it a treasure trove of rare minerals."},moor_arid:{n:"Scorched Moor",d:"Scorching temperatures, high winds, and low precipitation cause a near-constant cycle of fires to sweep this planet, punctuated by short bursts of lush rebirth between infernos."},moor_baseplanet:{n:"Plains",d:"Rocky outcroppings punctuate fields of tall grass in a planet dominated by misty highland terrain."},moor_red:{n:"Ionic Crimson",d:"A crimson algae has propagated wildly across this entire planet, coating its rocky hills with a constant red that masks the spilt blood of the heroes who defend it from tyranny."},moor_tundra:{n:"Tundra",d:"A perennially chilly climate has allowed short, colorful shrubs to flourish across this planet's surface."},oasis_base:{n:"Desert Oasis",d:"Rolling dunes across a beatiful beach world. (UNOFFICIAL) "},oasis_bleak:{n:"Bleak Oasis",d:"Description pending"},primordial_base:{n:"Volcanic Jungle",d:"Abundant with life, this wet planet is covered in deep oceans, thick forests, and tall grasses."},primordial_blue:{n:"Ionic Jungle",d:"The strange subversion of photosynthesis that sustains the oddly-hued flora that flourishes on this planet remains an intriguing mystery to Super Earth's greatest exo-biologists."},primordial_bug:{n:"Supercolony",d:"Entirely unforeseeable mutations from the Termicide led to hyper-accelerated bug growth on this planet, turning it into a Supercolony. It is corrupted beyond saving. The bugs infest every inch of it, down to the mantle, spawning trillions of spores every day."},primordial_dead:{n:"Deadlands",d:"The lifeless grey of this planet is interrupted only by the violet flowers that grow from strange, parasitic outcroppings."},primordial_purple:{n:"Ethereal Jungle",d:"This world teems with ethereal, boundless, and peculiar plant life that spreads silent and uninterrupted across its entire surface."},rift_active:{n:"ACCESS DENIED",d:"THIS BIOME IS UNKNOWN AT THIS TIME"},sandy_acid:{n:"Acidic Badlands",d:"Dense, toxic fumes from deep within the planet's crust seep out of cracks in the earth and coat the ground in a sickly haze."},sandy_base:{n:"Desert Dunes",d:"A blazing-hot desert planet, its rocky mesas are the sole interruptions to the endless sea of dunes."},sandy_mineral:{n:"Rocky Canyons",d:"This arid, rocky biome covering this world has driven the evolution of exceptionally efficient water usage in its various organisms."},sandy_moon:{n:"Moon",d:"A rocky, lonely moon with extremely valuable mineral deposits underneath the surface."},sandy_spiky:{n:"Desert Cliffs",d:"A desert planet prone to unpredictable and dangerous sand twisters."},super_earth:{n:"Super Earth",d:"Super Earth is the blinding beacon that shines the light of democracy through the stars. The sprawling heart that beats in time to mankind's quest of liberation. Here live the wealthy, important and proud. Here live those who have pulled themselv ,divers:"Helldivers",be:"Break-even",net:"Net/h",eta:"Est. finish"},obs:"measured",model:"estimated",regions:"regions included",done:"Done",needRate:"Needed pace",rateStart:"Average pace since start",rateRecent:"Pace, last hour",proj:"Projection at the end",perHour:"/h",waitData:"Keep the page open for a few minutes to measure the pace.",startUnknown:"Order start time unavailable: using only the pace measured by this page.",lowConf:"Measured over less than 12 hours: the pace changes a lot between day and night.",defEnds:"Ends in",defNeed:"Needs",defOutlasts:"The attack ends after the MO: the planet still counts as ours at the deadline.",kill:"Kill",with:"with",item:"item",enemy:"enemy",itemAny:"the required item",enemyAny:"designated enemies",aStratagem:"a stratagem",extract:"Successfully extract with",samples:"samples",objectives:"Complete {n} objectives",missions:"Complete {n} missions",operations:"Complete {n} operations",play:"Play {n} missions",use:"Use {item} {n} times",use1:"Use {item} once",objectives1:"Complete 1 objective",missions1:"Complete 1 mission",operations1:"Complete 1 operation",play1:"Play 1 mission",extractN1:"Complete 1 successful extraction",defendN1:"Defend against 1 attack",liberateN1:"Liberate 1 planet",liberateNf1:"Liberate 1 {f} planet",donate:"Donate {n} {item}",resources:"resources",extractN:"Complete {n} successful extractions",liberate:"Liberate {p}",hold:"Hold {p} when the order ends",defendN:"Defend against {n} attacks",liberateN:"Liberate {n} planets",liberateNf:"Liberate {n} {f} planets",net:"Liberate more planets than are lost",on:"on",enemies:"enemies",minDiff:"difficulty {d}+",tgtSamples:"Samples",tgtOps:"Operations",tgtMissions:"Missions",tgtEnemies:"Enemies",tgtExtractions:"Extractions",tgtObjectives:"Objectives",tgtGear:"Required gear",tgtResources:"Resources",what:{0:"objectives",1:"extractions",2:"extractions",3:"kills",4:"objectives",5:"missions",6:"uses",7:"missions",9:"operations",10:"donations"},unknownTask:"New objective type {n}",sCap:"Playerbase capacity",sAuto:"Automatic (measured, then reference)",sManual:"Manual",sCapVal:"Manual value (HP/h with 100%)",sDss:"DSS bonus (0.10 = +10%)",sHod:"Heavy Ordnance multiplier",sRec:"Record share",sContact:"API contact (name or handle)",sMotion:"Animations",mFull:"Full",mReduced:"Reduced",errApi:"Can't read the API ({e}). Retrying at the next refresh.",helpTitle:"Your browser blocked the connection to the API. What to do:",helpPreview:"You're viewing the page inside another app (for example Claude's preview), which blocks outside connections. Download the file and double-click it.",helpBrowser:"Open it in Chrome, Firefox, Edge or Safari, straight from the saved file.",helpBlocker:"If you use an ad blocker or an antivirus web filter, allow api.helldivers2.dev.",helpTest:"Try opening this address: if you see text with numbers, the API is working.",techDetails:"Technical details (send these to whoever helps you)",footer:"Unofficial community tool. Data: community API api.helldivers2.dev. Enemy and weapon names from Galactic Wide Web and helldivers-2/json on GitHub. Estimates are based on observed galactic war behavior, not official numbers."},EXPLAIN=`<p>Every enemy planet heals part of its health every hour: <b>regen</b>. If the damage it takes is lower than its regen, progress is zero, even with thousands of players on it.</p>
<p>How much each player is worth changes all the time: the game weighs every mission by the war's <b>impact multiplier</b>, which drops when more people are playing. The page reads it live from the API, so the numbers follow the current Major Order and the current playerbase, not a fixed reference. The damage constant that turns players into HP is measured by the page itself on the planets being fought over, and saved for your next visit.</p>
<dl>
<dt>Command log</dt><dd>Hand-made changes by Super Earth Command or a scripted enemy push: a planet that jumps or drops far more than its Helldivers explain, enemy resistance changed, a new attack, objectives edited. Also the latest Super Earth news. The war is recorded every 10 minutes even while nobody has the page open, so this covers everything since the start of the running orders (from 28 October 2026 on).</dd>
<dt>War map</dt><dd>Every planet being fought over, at its place in the galaxy and in its owner's colour, sized by its Helldivers. A white ring marks the order's planets, yellow brackets the planets of "What to do now", dashed lines the attacks. Hover or tap a planet for its numbers, click it for its conditions and loadout.</dd>
<dt>What did Joel do?</dt><dd>Joel is Arrowhead's Game Master. This card lists the changes made by hand through Super Earth Command: goals cut or raised, war effects switched on, planets that jumped or dropped far more than their Helldivers explain. Changes the Helldivers earned, like the reward for a won Strategic Opportunity, go in the news instead.</dd>
<dt>Early estimate</dt><dd>In the first hours of an order players are still arriving, so the pace is shaky. Until 3 hours of pace are measured, an objective is never called nearly impossible or impossible.</dd>
<dt>Between orders</dt><dd>With no Major Order running, the page shows how the last one went, the latest Super Earth news and where the Helldivers are fighting.</dd>
<dt>What to do now</dt><dd>The single move that changes the Major Order's outcome the most right now. The full list of moves is in the Plan tab.</dd>
<dt>Forecast</dt><dd>The bars under the stamp show why: what we do against what each objective needs, and how many times faster it would have to go. How realistic victory is: from "On track" (we make it as things are) to "Impossible" (not even with every player online).</dd>
<dt>Progress</dt><dd>How the order got here: progress since it began, the pace it needs, where today's pace leads, and the pace hour by hour. Hover or tap a chart to read any moment, tap the legend to hide a line.</dd>
<dt>What if\u2026?</dt><dd>Drag the slider to see what would happen with more or fewer players focused on the order.</dd>
<dt>Kills, samples, operations</dt><dd>The page compares the pace needed with the pace of the last 24 hours (a full day and night, recorded by the site), or the average since the order started until a day has been recorded, and shows the last hour too.</dd>
<dt>Option orders</dt><dd>Some orders say Option 1, Option 2: any one of them wins. The forecast and the plan then follow the most winnable option.</dd>
<dt>All active orders</dt><dd>When more than one order is running, the bar above shows what share of everyone online each one needs, counting players who help two orders at once (killing bots on a bot planet counts for both), and which order is the best bet if there aren't enough players for all of them.</dd>
<dt>Regions</dt><dd>Planets with regions are taken one region at a time, quickest first. While regions are being captured, the planet's own regen keeps eating into the damage already done, so splitting players across regions slows everything down.</dd>
<dt>New orders</dt><dd>The page checks the API every minute. When Super Earth issues a new Major Order, or changes the current one, everything on the page is worked out again from the new objectives.</dd>
<dt>Copy for Discord</dt><dd>Copies the order of the day as text ready to paste on Discord, Reddit or in chat.</dd>
<dt>Shortcuts</dt><dd><kbd>Q</kbd> and <kbd>E</kbd> switch tab, <kbd>1</kbd> to <kbd>4</kbd> open a tab, <kbd>R</kbd> refreshes, <kbd>?</kbd> opens this guide.</dd>
<dt>Language</dt><dd>English or Italian, from Settings. The game's own texts (order titles, briefings, news, names of planets, enemies and weapons) stay in English, as the API gives them.</dd>
</dl>
<p>Limits: the effect of the DSS and Heavy Ordnance isn't public. Measured on the war log since 2025, the DSS alone adds nothing visible, and Heavy Ordnance makes its planet count about 1.8 times while every other planet drops to about 0.7 (the war's total damage barely moves). the region capture bonus and how planet regen works against it are estimated, weapon-only kill counts can't be turned into a number of players, and the Game Master can change regen at any time.</p>`;

e:"Dona {n} {item}",resources:"risorse",extractN:"Completa {n} estrazioni riuscite",liberate:"Libera {p}",hold:"Mantieni {p} alla fine dell'ordine",defendN:"Respingi {n} attacchi",liberateN:"Libera {n} pianeti",liberateNf:"Libera {n} pianeti {f}",net:"Libera pi\xF9 pianeti di quanti ne perdi",on:"su",enemies:"nemici",minDiff:"difficolt\xE0 {d}+",tgtSamples:"Campioni",tgtOps:"Operazioni",tgtMissions:"Missioni",tgtEnemies:"Nemici",tgtExtractions:"Estrazioni",tgtObjectives:"Obiettivi",tgtGear:"Equipaggiamento richiesto",tgtResources:"Risorse",what:{0:"obiettivi",1:"estrazioni",2:"estrazioni",3:"uccisioni",4:"obiettivi",5:"missioni",6:"utilizzi",7:"missioni",9:"operazioni",10:"donazioni"},unknownTask:"Nuovo tipo di obiettivo {n}",sCap:"Capacit\xE0 dei giocatori",sAuto:"Automatica (misurata, poi riferimento)",sManual:"Manuale",sCapVal:"Valore manuale (HP/h con il 100%)",sDss:"Bonus DSS (0.10 = +10%)",sHod:"Moltiplicatore Heavy Ordnance",sRec:"Quota record",sContact:"Contatto per l'API (nome o nickname)",sMotion:"Animazioni",mFull:"Complete",mReduced:"Ridotte",errApi:"Impossibile leggere l'API ({e}). Riprovo al prossimo aggiornamento.",helpTitle:"Il tuo browser ha bloccato la connessione all'API. Cosa fare:",helpPreview:"Stai guardando la pagina dentro un'altra app (per esempio l'anteprima di Claude), che blocca le connessioni esterne. Scarica il file e aprilo con un doppio clic.",helpBrowser:"Aprilo in Chrome, Firefox, Edge o Safari, direttamente dal file salvato.",helpBlocker:"Se usi un ad blocker o il filtro web di un antivirus, consenti api.helldivers2.dev.",helpTest:"Prova ad aprire questo indirizzo: se vedi del testo con numeri, l'API funziona.",techDetails:"Dettagli tecnici (mandali a chi ti aiuta)",footer:"Strumento non ufficiale della community. Dati: API della community api.helldivers2.dev. Nomi di nemici e armi da Galactic Wide Web e helldivers-2/json su GitHub. Le stime si basano sul comportamento osservato della guerra galattica, non su numeri ufficiali. I testi di gioco (titoli degli ordini, briefing, notizie, nomi) restano in inglese come li fornisce l'API."},EXPLAIN_IT=`<p>Ogni pianeta nemico recupera ogni ora una parte della sua salute: la <b>rigenerazione</b>. Se il danno che riceve \xE8 inferiore alla rigenerazione, l'avanzamento \xE8 zero, anche con migliaia di giocatori sopra.</p>
<p>Quanto vale ogni giocatore cambia di continuo: il gioco pesa ogni missione con il <b>moltiplicatore d'impatto</b> della guerra, che scende quando gioca pi\xF9 gente. La pagina lo legge live dall'API, quindi i numeri seguono l'Ordine Maggiore e i giocatori attuali, non un riferimento fisso. La costante di danno che trasforma i giocatori in HP viene misurata dalla pagina stessa sui pianeti contesi, e salvata per la tua prossima visita.</p>
<dl>
<dt>Registro del Comando</dt><dd>Cambiamenti fatti a mano dal Comando di Super Terra o un'avanzata nemica scriptata: un pianeta che sale o scende molto pi\xF9 di quanto spieghino i suoi Helldivers, resistenza nemica cambiata, un nuovo attacco, obiettivi modificati. Pi\xF9 le ultime notizie da Super Terra. La guerra viene registrata ogni 10 minuti anche quando nessuno ha la pagina aperta, quindi copre tutto dall'inizio degli ordini in corso (dal 28 ottobre 2026 in poi).</dd>
<dt>Mappa di guerra</dt><dd>Ogni pianeta conteso, nella sua posizione nella galassia e nel colore di chi lo controlla, grande quanto i suoi Helldivers. Un anello bianco segna i pianeti dell'ordine, le parentesi gialle quelli di \xABCosa fare ora\xBB, le linee tratteggiate gli attacchi. Passa o tocca un pianeta per i suoi numeri, cliccalo per condizioni ed equipaggiamento.</dd>
<dt>Cos'ha fatto Joel?</dt><dd>Joel \xE8 il Game Master di Arrowhead. Questa scheda elenca i cambiamenti fatti a mano attraverso il Comando di Super Terra: obiettivi ridotti o alzati, effetti di guerra attivati, pianeti saliti o scesi molto pi\xF9 di quanto spieghino i loro Helldivers. I cambiamenti conquistati dagli Helldivers, come la ricompensa di un'Opportunit\xE0 Strategica vinta, finiscono invece nelle notizie.</dd>
<dt>Stima iniziale</dt><dd>Nelle prime ore di un ordine i giocatori stanno ancora arrivando, quindi il ritmo \xE8 ballerino. Finch\xE9 non sono misurate 3 ore di ritmo, un obiettivo non viene mai dato per quasi impossibile o impossibile.</dd>
<dt>Tra un ordine e l'altro</dt><dd>Quando non c'\xE8 un Ordine Maggiore in corso, la pagina mostra com'\xE8 andato l'ultimo, le ultime notizie da Super Terra e dove stanno combattendo gli Helldivers.</dd>
<dt>Cosa fare ora</dt><dd>La singola mossa che cambia di pi\xF9 l'esito dell'Ordine Maggiore in questo momento. L'elenco completo delle mosse \xE8 nella scheda Piano.</dd>
<dt>Previsione</dt><dd>Le barre sotto il timbro spiegano il perch\xE9: cosa facciamo contro cosa serve a ogni obiettivo, e quante volte pi\xF9 veloce dovrebbe andare. Quanto \xE8 realistica la vittoria: da \xABIn linea\xBB (ce la facciamo cos\xEC come siamo) a \xABImpossibile\xBB (nemmeno con tutti i giocatori online).</dd>
<dt>Andamento</dt><dd>Come l'ordine \xE8 arrivato fin qui: l'avanzamento dall'inizio, il ritmo necessario, dove porta il ritmo di oggi e il ritmo ora per ora. Passa o tocca un grafico per leggere qualsiasi momento, tocca la legenda per nascondere una linea.</dd>
<dt>E se\u2026?</dt><dd>Trascina il cursore per vedere cosa succederebbe con pi\xF9 o meno giocatori concentrati sull'ordine.</dd>
<dt>Uccisioni, campioni, operazioni</dt><dd>La pagina confronta il ritmo necessario con quello delle ultime 24 ore (un giorno e una notte interi, registrati dal sito), o con la media dall'inizio dell'ordine finch\xE9 non \xE8 registrato un giorno intero, e mostra anche l'ultima ora.</dd>
<dt>Ordini a opzioni</dt><dd>Alcuni ordini dicono Opzione 1, Opzione 2: ne basta una per vincere. La previsione e il piano seguono allora l'opzione pi\xF9 vincibile.</dd>
<dt>Tutti gli ordini attivi</dt><dd>Quando sono in corso pi\xF9 ordini, la barra in alto mostra quale quota di chi \xE8 online serve a ognuno, contando i giocatori che aiutano due ordini insieme (uccidere bot su un pianeta bot conta per entrambi), e quale ordine \xE8 la scelta migliore se non ci sono giocatori per tutti.</dd>
<dt>Regioni</dt><dd>I pianeti con regioni si prendono una regione alla volta, dalla pi\xF9 rapida. Mentre si conquistano le regioni, la rigenerazione del pianeta continua a mangiarsi il danno gi\xE0 fatto, quindi dividere i giocatori tra pi\xF9 regioni rallenta tutto.</dd>
<dt>Nuovi ordini</dt><dd>La pagina controlla l'API ogni minuto. Quando Super Terra emette un nuovo Ordine Maggiore, o cambia quello in corso, tutto nella pagina viene ricalcolato dai nuovi obiettivi.</dd>
<dt>Copia per Discord</dt><dd>Copia l'ordine del giorno come testo pronto da incollare su Discord, Reddit o in chat.</dd>
<dt>Scorciatoie</dt><dd><kbd>Q</kbd> ed <kbd>E</kbd> cambiano scheda, da <kbd>1</kbd> a <kbd>4</kbd> aprono una scheda, <kbd>R</kbd> aggiorna, <kbd>?</kbd> apre questa guida.</dd>
<dt>Lingua</dt><dd>Inglese o italiano, dalle Impostazioni. I testi del gioco (titoli degli ordini, briefing, notizie, nomi di pianeti, nemici e armi) restano in inglese, come li fornisce l'API.</dd>
</dl>
<p>Limiti: l'effetto della DSS e dell'Heavy Ordnance non \xE8 pubblico. Misurato sul registro di guerra dal 2025, la DSS da sola non aggiunge niente di visibile, e l'Heavy Ordnance fa contare il suo pianeta circa 1,8 volte mentre tutti gli altri pianeti scendono a circa 0,7 (il danno totale della guerra si muove appena). Il bonus per la conquista delle regioni e il modo in cui la rigenerazione del pianeta lo contrasta sono stimati, i conteggi di uccisioni con un'arma specifica non si possono tradurre in un numero di giocatori, e il Game Master pu\xF2 cambiare la rigenerazione in qualsiasi momento.</p>`;
