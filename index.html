<script>
const GAME={env:{acid_storms:{n:"Acid Storms",d:"Corrosive acid storms temporarily reduce armor effectiveness for both enemy and friendly units."},blizzards:{n:"Blizzards",d:"Intense blizzard reduce mobility and moderately reduce visibility for both enemy and friendly units."},extreme_cold:{n:"Extreme Cold",d:"Icy temperatures reduce rate of fire and delay heat buildup in weapons."},fire_tornadoes:{n:"Fire Tornadoes",d:"Planet is ravaged by deadly fire tornadoes."},intense_heat:{n:"Intense Heat",d:"High temperatures increase stamina drain and speed up heat buildup in weapons."},ion_storms:{n:"Ion Storms",d:"Ion storms intermittently disable Stratagems."},meteor_storms:{n:"Meteor Storms",d:"Meteors impact the surface causing massive damage."},none:{n:"None",d:"This planet's environment is not yet known, or has no environmental modifiers."},normal_temp:{n:"Normal Temperature",d:"Average temperatures convey no significant change to weapons or stamina."},rainstorms:{n:"Rainstorms",d:"Torrential rainstorms reduce visibility."},sandstorms:{n:"Sandstorms",d:"Dense sandstorms reduce mobility and greatly reduce visibility for both enemy and friendly units."},thick_fog:{n:"Thick Fog",d:"Dense fog lightly reduce visibility for both enemy and friendly units."},tremors:{n:"Tremors",d:"Frequent earthquakes stun players and enemies alike."},volcanic_activity:{n:"Volcanic Activity",d:"Volcanoes throw burning rocks around this planet."}},bio:{arctic_glacier_base:{n:"Icy Glaciers",d:"Submerged in eternal winter, this world's frosty peaks glimmer in the light of its too-distant star."},arctic_glacier_coldrocky:{n:"Boneyard",d:"Ice and moss-covered rock can be found across most of the surface of this planet."},arctic_glacier_tien_kwan:{n:"Tien Kwan Special",d:"Ice and moss-covered rock can be found across most of the surface of this planet."},blackhole:{n:"Black Hole",d:"The planet is gone, the ultimate price to pay in the war for humanity's survival."},bug_hiveworld:{n:"Hive World",d:"This planet has been completely infested by the Terminids, transformed inside and out into a hive of Tyranny."},cyberstan:{n:"Cyberstan Megafactory",d:"Cyberstan, once again, forms the axis of the Cyborg Legion's insurrection. Massive Megafactories cover its surface, churning out mechanical armies and weapons of mass extinction."},deciduous_autumn:{n:"Deciduous Autumn Forest",d:"Broadleaf woodlands spread across rolling hills, broken by shallow waters that wind through mossy logs, flowers, and stone. (UNOFFICIAL)"},deciduous_base:{n:"Deciduous Forest",d:"Broadleaf woodlands spread across rolling hills, broken by shallow waters that wind through mossy logs, flowers, and stone. (UNOFFICIAL)"},deciduous_crimson:{n:"Deciduous Crimson Forest",d:"Description pending"},deciduous_fall:{n:"Deciduous Autumn Forest",d:"Broadleaf woodlands spread across rolling hills, broken by shallow waters that wind through mossy logs, flowers, and stone. (UNOFFICIAL)"},magma_base:{n:"Magma",d:"Constant eruptions keep this planet covered in lava flows and utterly inhospitable to Democratic life. It also makes it a treasure trove of rare minerals."},moor_arid:{n:"Scorched Moor",d:"Scorching temperatures, high winds, and low precipitation cause a near-constant cycle of fires to sweep this planet, punctuated by short bursts of lush rebirth between infernos."},moor_baseplanet:{n:"Plains",d:"Rocky outcroppings punctuate fields of tall grass in a planet dominated by misty highland terrain."},moor_red:{n:"Ionic Crimson",d:"A crimson algae has propagated wildly across this entire planet, coating its rocky hills with a constant red that masks the spilt blood of the heroes who defend it from tyranny."},moor_tundra:{n:"Tundra",d:"A perennially chilly climate has allowed short, colorful shrubs to flourish across this planet's surface."},oasis_base:{n:"Desert Oasis",d:"Rolling dunes across a beatiful beach world. (UNOFFICIAL) "},oasis_bleak:{n:"Bleak Oasis",d:"Description pending"},primordial_base:{n:"Volcanic Jungle",d:"Abundant with life, this wet planet is covered in deep oceans, thick forests, and tall grasses."},primordial_blue:{n:"Ionic Jungle",d:"The strange subversion of photosynthesis that sustains the oddly-hued flora that flourishes on this planet remains an intriguing mystery to Super Earth's greatest exo-biologists."},primordial_bug:{n:"Supercolony",d:"Entirely unforeseeable mutations from the Termicide led to hyper-accelerated bug growth on this planet, turning it into a Supercolony. It is corrupted beyond saving. The bugs infest every inch of it, down to the mantle, spawning trillions of spores every day."},primordial_dead:{n:"Deadlands",d:"The lifeless grey of this planet is interrupted only by the violet flowers that grow from strange, parasitic outcroppings."},primordial_purple:{n:"Ethereal Jungle",d:"This world teems with ethereal, boundless, and peculiar plant life that spreads silent and uninterrupted across its entire surface."},rift_active:{n:"ACCESS DENIED",d:"THIS BIOME IS UNKNOWN AT THIS TIME"},sandy_acid:{n:"Acidic Badlands",d:"Dense, toxic fumes from deep within the planet's crust seep out of cracks in the earth and coat the ground in a sickly haze."},sandy_base:{n:"Desert Dunes",d:"A blazing-hot desert planet, its rocky mesas are the sole interruptions to the endless sea of dunes."},sandy_mineral:{n:"Rocky Canyons",d:"This arid, rocky biome covering this world has driven the evolution of exceptionally efficient water usage in its various organisms."},sandy_moon:{n:"Moon",d:"A rocky, lonely moon with extremely valuable mineral deposits underneath the surface."},sandy_spiky:{n:"Desert Cliffs",d:"A desert planet prone to unpredictable and dangerous sand twisters."},super_earth:{n:"Super Earth",d:"Super Earth is the blinding beacon that shines the light of democracy through the stars. The sprawling heart that beats in time to mankind's quest of liberation. Here live the wealthy, important and proud. Here live those who have pulled themselves up by their bootstraps and achieved their dreams. Here live the citizens of Super Earth."},swamp_base:{n:"Basic Swamp",d:"Tall, gnarled trees flourish across the surface of this forested world. Sunlight filters past dangling vines, to the saturated undergrowth below."},swamp_haunted:{n:"Haunted Swamp",d:"Squelching mud, twisting roots; the odor of rot and anarchy. A teeming, endless morass."},unknown:{n:"Unknown",d:"This planet's biome is unknown at this time."}},fx:{1127:{n:"ARSENAL AUGMENTATION: EAGLE 500KG BOMB",d:"High Command has authorized the temporary addition of the Eagle 500kg Bomb Stratagem to all Helldiver loadouts."},1128:{n:"ARSENAL AUGMENTATION: EAGLE 500KG BOMB",d:"High Command has authorized the temporary addition of the Eagle 500kg Bomb Stratagem to all Helldiver loadouts."},1129:{n:"ARSENAL AUGMENTATION: SH-32 SHIELD GENERATOR PACK",d:"High Command has authorized the temporary addition of the SH-32 Shield Generator Pack Stratagem to all Helldiver loadouts."},1130:{n:"ARSENAL AUGMENTATION: A/ARC-3 TESLA TOWER",d:"High Command has authorized the temporary addition of the A/ARC-3 Tesla Tower Stratagem to all Helldiver loadouts."},1133:{n:"ARSENAL AUGMENTATION: A/M-12 MORTAR SENTRY",d:"High Command has authorized the temporary addition of the A/M-12 Mortar Sentry Stratagem to all Helldiver loadouts."},1137:{n:"ARSENAL AUGMENTATION: RS-422 RAILGUN",d:"High Command has authorized the temporary addition of the RS-422 Railgun Stratagem to all Helldiver loadouts."},1139:{n:"ARSENAL AUGMENTATION: EAGLE NAPALM AIRSTRIKE",d:"High Command has authorized the temporary addition of the Eagle Napalm Airstrike Stratagem to all Helldiver loadouts."},1142:{n:"ARSENAL AUGMENTATION: EAGLE 500KG BOMB",d:"High Command has authorized the temporary addition of the Eagle 500kg Bomb Stratagem to all Helldiver loadouts."},1143:{n:"ARSENAL AUGMENTATION: MG-43 MACHINE GUN",d:"High Command has authorized the temporary addition of the MG-43 Machine Gun Stratagem to all Helldiv  addition of the Eagle Napalm Airstrike Stratagem to all Helldiver loadouts."},1162:{n:"ARSENAL AUGMENTATION: EXO-45 PATRIOT EXOSUIT",d:"High Command has authorized the temporary addition of the EXO-45 Patriot Exosuit Stratagem to all Helldiver loadouts."},1163:{n:"ARSENAL AUGMENTATION: EAGLE 110MM ROCKET PODS",d:"High Command has authorized the temporary addition of the Eagle 110mm Rocket Pods Stratagem to all Helldiver loadouts."},1165:{n:"ARSENAL AUGMENTATION: LIFT-850 JUMP PACK",d:"High Command has authorized the temporary addition of the LIFT-850 Jump Pack Stratagem to all Helldiver loadouts."},1166:{n:"ARSENAL AUGMENTATION: EAGLE 500KG BOMB",d:"High Command has authorized the temporary addition of the Eagle 500kg Bomb Stratagem to all Helldiver loadouts."},1167:{n:"ARSENAL AUGMENTATION: FLAM-40 FLAMETHROWER",d:"High Command has authorized the temporary addition of the FLAM-40 Flamethrower Stratagem to all Helldiver loadouts."},1168:{n:"ARSENAL AUGMENTATION: LAS-98 LASER CANNON",d:"High Command has authorized the temporary addition of the LAS-98 Laser Cannon Stratagem to all Helldiver loadouts."},1169:{n:"ARSENAL AUGMENTATION: EAT-17 EXPENDABLE ANTI-TANK",d:"High Command has authorized the temporary addition of the EAT-17 Expendable Anti-Tank Stratagem to all Helldiver loadouts."},1170:{n:"ARSENAL AUGMENTATION: RL-77 AIRBURST ROCKET LAUNCHER",d:"High Command has authorized the temporary addition of the RL-77 Airburst Rocket Launcher Stratagem to all Helldiver loadouts."},1171:{n:"ARSENAL AUGMENTATION: MD-17 ANTI-TANK MINES",d:"High Command has authorized the temporary addition of the MD-17 Anti-Tank Mines Stratagem to all Helldiver loadouts."},1172:{n:"ARSENAL AUGMENTATION: ORBITAL GAS STRIKE",d:"High Command has authorized the temporary addition of the Orbital Gas Strike Stratagem to all Helldiver loadouts."},1173:{n:"ARSENAL AUGMENTATION: EXO-49 EMANCIPATOR EXOSUIT",d:"High Command has authorized the temporary addition of the EXO-49 Emancipator Exosuit Stratagem to all Helldiver loadouts."},1174:{n:"ARSENAL AUGMENTATION: A/M-12 MORTAR SENTRY",d:"High Command has authorized the temporary addition of the A/M-12 Mortar Sentry Stratagem to all Helldiver loadouts."},1175:{n:"ARSENAL AUGMENTATION: A/G-16 GATLING SENTRY",d:"High Command has authorized the temporary addition of the A/G-16 Gatling Sentry Stratagem to all Helldiver loadouts."},1177:{n:"Black Hole",d:"This planet has been turned into a black hole."},1179:{n:"ARSENAL AUGMENTATION: AC-8 AUTOCANNON",d:"High Command has authorized the temporary addition of the AC-8 Autocannon Stratagem to all Helldiver loadouts."},1181:{n:"ARSENAL AUGMENTATION: MLS-4X COMMANDO",d:"High Command has authorized the temporary addition of the MLS-4X Commando Stratagem to all Helldiver loadouts."},1184:{n:"ARSENAL AUGMENTATION: MD-I4 INCENDIARY MINES",d:"High Command has authorized the temporary addition of the MD-I4 Incendiary Mines Stratagem to all Helldiver loadouts."},1185:{n:"ARSENAL AUGMENTATION: MD-6 ANTI-PERSONNEL MINEFIELD",d:"High Command has authorized the temporary addition of the MD-6 Anti-Personnel Minefield Stratagem to all Helldiver loadouts."},1186:{n:"Light Gloom",d:"This world is lightly obscured by a gloom cloud."},1187:{n:"Gloom",d:"A gloom cloud enveloped this world."},1188:{n:"Dense Gloom",d:"A thick gloom cloud obscures this world from view."},1190:{n:"Unreachable",d:"Our sensors can no longer monitor this planet."},1193:{n:"Gloom Border",d:"This world is on the border of the interstellar wall of gloom."},1194:{n:"ARSENAL AUGMENTATION: ORBITAL NAPALM BARRAGE",d:"High Command has authorized the temporary addition of the Orbital Napalm Barrage Stratagem to all Helldiver loadouts."},1195:{n:"DSS Construction Site- Phase 1",d:"Construction has began on the Democracy Space Station.  The local populace is honored to host thousands of construction crews for this historic event."},1196:{n:"DSS Logistics Hub",d:"Parts for the Democracy Space Station are prefabricated all over the Galaxy, then shipped here to await assembly."},1197:{n:"Xenoentomology Center",d:"Those who study Terminid behavior, ecology and E-710 potential gather here for cross-disciplinary research."},1198:{n:"Deep Mantle Forge Complex",d:"The smelters and refineries on this planet turn crude materials into usable hardware."},1199:{n:"DSS Construction Site- Phase 2",d:"Democracy Space Station construction is well underway. The local economy is flourishing as the planet's populace has centupled, and all the Galaxy can feel their democratic fervor."},1200:{n:"ARSENAL AUGMENTATION: A/ARC-3 TESLA TOWER",d:"High Command has authorized the temporary addition of the A/ARC-3 Tesla Tower Stratagem to all Helldiver loadouts."},1202:{n:"THE JET BRIGADE (Enemies)",d:"The Automatons have deployed a new series of specialized models on this planet. These upgraded bots utilize stolen Jump Pack technology, heartlessly pillaged from the bodies of fallen Helldivers and reverse-engineered into something nearly unrecognizeable."},1203:{n:"THE JET BRIGADE",d:"The Automatons have deployed a new series of specialized models on this planet. These upgraded bots utilize stolen Jump Pack technology, heartlessly pillaged from the bodies of fallen Helldivers and reverse-engineered into something nearly unrecognizeable."},1204:{n:"LIBERTY DAY",d:"This planet is celebrating Liberty Day."},1205:{n:"DSS CONSTRUCTION SITE - PHASE 3",d:"Construction of the Democracy Space Station is nearing completion. This project, which has employed millions, will soon take its place among the greatest achievements of Democracy."},1206:{n:"TERMINID RESEARCH PRESERVE",d:"Terminids are held safely within massive compounts on this planet for study and E-710 extraction."},1207:{n:"ARSENAL AUGMENTATION: E/MG-101 HMG EMPLACEMENT",d:"High Command has authorized the temporary addition of the E/MG-101 HMG Emplacement Stratagem to all Helldiver loadouts."},1209:{n:"EAGLE STORM",d:"The DSS deploys <i=1>Eagle Strafing Runs</i> duri <ol><li><b>The call</b> at the top is the one move that changes the Major Order most right now, with the order's forecast beside it.</li>
<li><b>The races</b> below it are the objectives: each bar ends at its goal, and the pale band is where today's pace lands by the deadline.</li>
<li><b>The tabs</b> hold the detail: the full plan, progress charts, the command log and the war map.</li></ol></section>
<section><h3>The five calls</h3>
<dl class="ex-scale">
<div class="vl-done"><dt><span class="pill vl-done"><span>Done</span></span></dt><dd>The objective, or the whole order, is complete.</dd></div>
<div class="vl-ok"><dt><span class="pill vl-ok"><span>On track</span></span></dt><dd>At today's pace we make it in time.</dd></div>
<div class="vl-push"><dt><span class="pill vl-push"><span>Needs a push</span></span></dt><dd>Winnable, with more Helldivers than today, or with everyone on the call.</dd></div>
<div class="vl-record"><dt><span class="pill vl-record"><span>Needs a record</span></span></dt><dd>Only a record turnout wins it: more of the playerbase than any order has drawn.</dd></div>
<div class="vl-out"><dt><span class="pill vl-out"><span>Out of reach</span></span></dt><dd>Not winnable even with (almost) every Helldiver online. The page says so, and points to the order still worth playing.</dd></div>
</dl>
<p>Before a few hours of pace are measured, an objective is <b>Too early to call</b>, and it is never called out of reach in its first 3 hours.</p></section>
<section><h3>Words used here</h3>
<dl>
<dt>Regen</dt><dd>Every enemy planet heals part of its health every hour. If the damage it takes is lower than its regen, progress is zero, even with thousands of Helldivers on it.</dd>
<dt>DSS</dt><dd>The Democracy Space Station, voted from planet to planet. Measured on the war log since 2025, it adds nothing visible to liberation on its own.</dd>
<dt>Heavy Ordnance</dt><dd>The DSS's bombardment: its planet counts about 1.8 times while every other planet drops to about 0.7 (the war's total damage barely moves).</dd>
<dt>Joel</dt><dd>Arrowhead's Game Master, who steers the war by hand through Super Earth Command: goals cut or raised, planets that jump, new attacks. The Command log lists his moves.</dd>
<dt>Front</dt><dd>All the planets of one enemy faction. Kill counts usually count anywhere on that front.</dd>
<dt>Impact multiplier</dt><dd>How much each mission is worth: the game lowers it when more people play. The page reads it live, so the numbers follow today's playerbase.</dd>
</dl></section>
<section><h3>The parts of the page</h3>
<dl>
<dt>Best bet</dt><dd>When several orders run at once, the desk compares them, counting Helldivers who help two orders at once (killing bots on a bot planet counts for both). If there aren't enough Helldivers for all of them, the best bet is marked on its tab and the page opens on it.</dd>
<dt>Forecast</dt><dd>Beside the call: the order's call on the five-step scale, and the bars that explain it, Helldivers there against Helldivers needed, or today's pace against the pace needed.</dd>
<dt>When a planet falls</dt><dd>Three things go into it: the planet's own pace over the last 6 hours (it already carries the DSS, Joel's multipliers and how hard the planet is), everyone's strength that week, and the players still to come. The range next to it is where the real fall landed 8 to 9 times in 10 when the forecast was replayed on the war log. The Archive keeps this track record.</dd>
<dt>Plan</dt><dd>Every useful move ranked by importance, with what it changes. "What if\u2026?" shows what happens with more or fewer players.</dd>
<dt>Progress</dt><dd>How the order got here: progress since it began, the pace it needs, where today's pace leads, hour by hour. Hover or tap a chart to read any moment.</dd>
<dt>Command log</dt><dd>Hand-made changes by Super Earth Command or a scripted enemy push, and the latest Super Earth news. The war is recorded every 10 minutes even while nobody has the page open.</dd>
<dt>Map</dt><dd>Every planet being fought over, at its place in the galaxy, in its owner's colour and sized by its Helldivers. A ring marks the order's planets, brackets the planet of the call, dashed lines the attacks.</dd>
<dt>Kills, samples, operations</dt><dd>The pace needed is compared with the last 24 hours (a full day and night), or the average since the start until a day has been recorded, and the last hour.</dd>
<dt>Option orders</dt><dd>Some orders say Option 1, Option 2: any one of them wins. The forecast and the plan follow the most winnable option.</dd>
<dt>Regions</dt><dd>Planets with regions are taken one region at a time, quickest first; splitting players across regions slows everything down.</dd>
<dt>Share image, Copy for Discord</dt><dd>The call as a picture or as text, ready for Reddit, Discord or chat, with the desk's best bet when several orders run.</dd>
<dt>Links</dt><dd>The address follows the order and the tab you are on (for example <code>#order=\u2026&amp;tab=plan</code>), so you can link to a call directly.</dd>
<dt>Shortcuts</dt><dd><kbd>Q</kbd> and <kbd>E</kbd> switch tab, <kbd>1</kbd> to <kbd>4</kbd> open a tab, <kbd>R</kbd> refreshes, <kbd>?</kbd> opens this guide.</dd>
</dl></section>
<p class="ex-limits">Limits: the effect of the DSS and Heavy Ordnance isn't public, the region capture bonus is estimated, weapon-only kill counts can't be turned into a number of players, and the Game Master can change regen at any time.</p>`;
