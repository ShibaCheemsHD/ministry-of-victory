 has no environmental modifiers."},normal_temp:{n:"Normal Temperature",d:"Average temperatures convey no significant change to weapons or stamina."},rainstorms:{n:"Rainstorms",d:"Torrential rainstorms reduce visibility."},sandstorms:{n:"Sandstorms",d:"Dense sandstorms reduce mobility and greatly reduce visibility for both enemy and friendly units."},thick_fog:{n:"Thick Fog",d:"Dense fog lightly reduce visibility for both enemy and friendly units."},tremors:{n:"Tremors",d:"Frequent earthquakes stun players and enemies alike."},volcanic_activity:{n:"Volcanic Activity",d:"Volcanoes throw burning rocks around this planet."}},bio:{arctic_glacier_base:{n:"Icy Glaciers",d:"Submerged in eternal winter, this world's frosty peaks glimmer in the light of its too-distant star."},arctic_glacier_coldrocky:{n:"Boneyard",d:"Ice and moss-covered rock can be found across most of the surface of this planet."},arctic_glacier_tien_kwan:{n:"Tien Kwan Special",d:"Ice and moss-covered rock can be found across most of the surface of this planet."},blackhole:{n:"Black Hole",d:"The planet is gone, the ultimate price to pay in the war for humanity's survival."},bug_hiveworld:{n:"Hive World",d:"This planet has been completely infested by the Terminids, transformed inside and out into a hive of Tyranny."},cyberstan:{n:"Cyberstan Megafactory",d:"Cyberstan, once again, forms the axis of the Cyborg Legion's insurrection. Massive Megafactories cover its surface, churning out mechanical armies and weapons of mass extinction."},deciduous_autumn:{n:"Deciduous Autumn Forest",d:"Broadleaf woodlands spread across rolling hills, broken by shallow waters that wind through mossy logs, flowers, and stone. (UNOFFICIAL)"},deciduous_base:{n:"Deciduous Forest",d:"Broadleaf woodlands spread across rolling hills, broken by shallow waters that wind through mossy logs, flowers, and stone. (UNOFFICIAL)"},deciduous_crimson:{n:"Deciduous Crimson Forest",d:"Description pending"},deciduous_fall:{n:"Deciduous Autumn Forest",d:"Broadleaf woodlands spread across rolling hills, broken by shallow waters that wind through mossy logs, flowers, and stone. (UNOFFICIAL)"},magma_base:{n:"Magma",d:"Constant eruptions keep this planet covered in lava flows and utterly inhospitable to Democratic life. It also makes it a treasure trove of rare minerals."},moor_arid:{n:"Scorched Moor",d:"Scorching temperatures, high winds, and low precipitation cause a near-constant cycle of fires to sweep this planet, punctuated by short bursts of lush rebirth between infernos."},moor_baseplanet:{n:"Plains",d:"Rocky outcroppings punctuate fields of tall grass in a planet dominated by misty highland terrain."},moor_red:{n:"Ionic Crimson",d:"A crimson algae has propagated wildly across this entire planet, coating its rocky hills with a constant red that masks the spilt blood of the heroes who defend it from tyranny."},moor_tundra:{n:"Tundra",d:"A perennially chilly climate has allowed short, colorful shrubs to flourish across this planet's surface."},oasis_base:{n:"Desert Oasis",d:"Rolling dunes across a beatiful beach world. (UNOFFICIAL) "},oasis_bleak:{n:"Bleak Oasis",d:"Description pending"},primordial_base:{n:"Volcanic Jungle",d:"Abundant with life, this wet planet is covered in deep oceans, thick forests, and tall grasses."},primordial_blue:{n:"Ionic Jungle",d:"The strange subversion of photosynthesis that sustains the oddly-hued flora that flourishes on this planet remains an intriguing mystery to Super Earth's greatest exo-biologists."},primordial_bug:{n:"Supercolony",d:"Entirely unforeseeable mutations from the Termicide led to hyper-accelerated bug growth on this planet, turning it into a Supercolony. It is corrupted beyond saving. The bugs infest every inch of it, down to the mantle, spawning trillions of spores every day."},primordial_dead:{n:"Deadlands",d:"The lifeless grey of this planet is interrupted only by the violet flowers that grow from strange, parasitic outcroppings."},primordial_purple:{n:"Ethereal Jungle",d:"This world teems with ethereal, boundless, and peculiar plant life that spreads silent and uninterrupted across its entire surface."},rift_active:{n:"ACCESS DENIED",d:"THIS BIOME IS UNKNOWN AT THIS TIME"},sandy_acid:{n:"Acidic Badlands",d:"Dense, toxic fumes from deep within the planet's crust seep out of cracks in the earth and coat the ground in a sickly haze."},sandy_base:{n:"Desert Dunes",d:"A blazing-hot desert planet, its rocky mesas are the sole interruptions to the endless sea of dunes."},sandy_mineral:{n:"Rocky Canyons",d:"This arid, rocky biome covering this world has driven the evolution of exceptionally efficient water usage in its various organisms."},sandy_moon:{n:"Moon",d:"A rocky, lonely moon with extremely valuable mineral deposits underneath the surface."},sandy_spiky:{n:"Desert Cliffs",d:"A desert planet prone to unpredictable and dangerous sand twisters."},super_earth:{n:"Super Earth",d:"Super Earth is the blinding beacon that shines the light of democracy through the stars. The sprawling heart that beats in time to mankind's quest of liberation. Here live the wealthy, important and proud. Here live those who have pulled themselves up by their bootstraps and achieved their dreams. Here live the citizens of Super Earth."},swamp_base:{n:"Basic Swamp",d:"Tall, gnarled trees flourish across the surface of this forested world. Sunlight filters past dangling vines, to the saturated undergrowth below."},swamp_haunted:{n:"Haunted Swamp",d:"Squelching mud, twisting roots; the odor of rot and anarchy. A teeming, endless morass."},unknown:{n:"Unknown",d:"This planet's biome is unknown at this time."}},fx:{1127:{n:"ARSENAL AUGMENTATION: EAGLE 500KG BOMB",d:"High Command has authorized the temporary addition of the Eagle 500kg Bomb Stratagem to all Helldiver loadouts."},1128:{n:"ARSENAL AUGMENTATION: EAGLE 500KG BOMB",d:"High Command has authorized the temporary addition of the Eagle 500kg Bomb Stratagem to all Helldiver loadouts."},1129:{n:" able lack thereof, indicate that the source of the Void anomaly is located here. All effort must go to enabling FTL travel to these coordinates."},1413:{n:"INVASION FLEET (Enemies)",d:"The main invasion fleet of the Illuminate, from arrogant Overseers to throngs of brainwashed Super Earth civilians, are present on this planet. Exterminate on sight or else risk violent resistance, or worse, treasonous propaganda."},1414:{n:"INVASION FLEET",d:"The main invasion fleet of the Illuminate, from arrogant Overseers to throngs of brainwashed Super Earth civilians, are present on this planet. Exterminate on sight or else risk violent resistance, or worse, treasonous propaganda."},1430:{n:"CAUSTIC STRAIN (Enemies)",d:"A strain of Terminids with highly alkaline bile sacs have infested this planet. Prepare to face enemies that discharge corrosive fluids and burst violently upon death."},1431:{n:"CAUSTIC STRAIN",d:"A strain of Terminids with highly alkaline bile sacs have infested this planet. Prepare to face enemies that discharge corrosive fluids and burst violently upon death."}},foe:{23741406:{one:"Radical",many:"Radicals"},878778730:{one:"Trooper",many:"Troopers"},"2664856027":{one:"Shredder Tank",many:"Shredder Tanks"},1371180916:{one:"Agitator",many:"Agitators"},"4066406510":{one:"Vox Engine",many:"Vox Engines"},"2651633799":{one:"Charger",many:"Chargers"},1378841226:{one:"Dragon Roach",many:"Dragon Roaches"},717622970:{one:"Bile Spewer",many:"Bile Spewers"},444529084:{one:"Bile Spitter",many:"Bile Spitters"},"4211847317":{one:"Voteless",many:"Voteless"},"3621116014":{one:"Obtruder",many:"Obtruders"},1870840792:{one:"Gatekeeper",many:"Gatekeepers"},2118086817:{one:"Wretch",many:"Wretches"},"3922421925":{one:"Crusher",many:"Crushers"}},item:{"3827587060":"E/MG-101 HMG Emplacement",376960160:"APW-1 Anti-Materiel Rifle","2197477188":"Orbital Railcannon Strike"},gal:{p:[[0,"Super Earth",0,0,"Sol","Super Earth",[],[],"M-33.8 19L-37.5 1.4L-35.9 -13.6L-6 -35.6L20.8 -22L34.6 2.6L3 ne Major Order (0.77 = 77%): the line between "needs a record" and "out of reach".',hContact:"Sent to the community API with each request so its maintainers can reach this site. Nothing else is sent.",sReset:"Reset the model to its defaults",sResetDone:"Forecast model reset to its defaults.",sBad:"That value is out of range: the previous one is kept.",errApiH:"No connection to Super Earth",errApi:"The Helldivers 2 community API isn't answering, so there's nothing to show yet. The page tries again on its own every few minutes.",helpOnline:"Check that you are online. The API sometimes goes down for a few minutes during big game updates.",helpTitle:"Your browser blocked the connection to the API. What to do:",helpPreview:"You're viewing the page inside another app (for example Claude's preview), which blocks outside connections. Download the file and double-click it.",helpBrowser:"Open it in Chrome, Firefox, Edge or Safari, straight from the saved file.",helpBlocker:"If you use an ad blocker or an antivirus web filter, allow api.helldivers2.dev.",helpTest:"Try opening this address: if you see text with numbers, the API is working.",techDetails:"Technical details (send these to whoever helps you)",worth:{line:"Average mission \u2248 {m} \xB7 3 equivalent missions \u2248 {op} \xB7 1% \u2248 {n} missions.",measured:"Measured estimate.",default:"Reference estimate.",remaining:"About {n} more before future enemy regen.",remainingDefense:"About {n} more at this impact; the defense deadline still applies.",aria:"What one mission is worth on {planet}",one:"One mission won",op:"One operation (3 missions)",per1:"Missions for 1%",leftFree:"Missions to liberate it",leftHold:"Missions to hold it",free:"liberate",hold:"hold",how:"How missions count",more:"Now each mission counts {p} more than the day's average: fewer Helldivers online.",less:"Now each mission counts {p} less than the day's average: the galaxy is crowded."},faq:{title:"Managed Democracy for Dummies",btn:"FAQ",open:"Managed Democracy for Dummies: how your missions count",intro:"What every Helldiver asks before dropping. Arrowhead changes these rules with patches: below, what is known today, and what isn't.",unsure:"Not confirmed",items:[{id:"count",q:"Which missions count for the Major Order?",a:"<p>It depends on the objective, and the order's own text is the rule.</p><ul><li><b>Liberate or defend a planet:</b> a mission on that planet counts once its <b>main objective</b> is done. The per-mission estimate below is an average, not a formula for your squad's exact reward. Side objectives and outposts may count toward war impact too. The planet needs an active campaign: it shows on the war map.</li><li><b>Kill objectives</b> (\u201CKill 50M Automatons\u201D): kills of that enemy count wherever you fight them, unless the objective names a planet, a weapon or a difficulty: then only those.</li><li><b>Collect or complete objectives:</b> exactly as written. The Races tab shows each count from the latest update.</li></ul>"},{id:"worth",q:"How much is one mission worth?",a:`{live}<p>The game shares the war's damage among everyone playing: the more missions are being won across the galaxy, the less each one is worth. That is why one mission counts more at quiet hours and less on a crowded evening, but this does not mean the galaxy's total liberation damage grows in direct proportion to the number of Helldivers online.</p><p class="faq-src">The recorder compares health lost, including enemy regen, with missions won on ordinary liberation planets. With enough samples it uses their median; otherwise it uses a reference value. This is an estimated average across missions, not a guaranteed reward for your mission. Three equivalent missions are not an exact operation reward: difficulty and completion bonuses may change it. Region capture and defense impact can differ.</p>`},{id:"difficulty",q:"Does difficulty matter?",a:"<p><b>Yes, for liberation.</b> Harder missions carry more weight, and finishing the whole operation adds a bonus on its last mission. Community measurements put the top difficulties at several times the easiest ones.</p><p>But a failed mission adds nothing. Play the highest difficulty your squad <b>reliably clears</b>, and finish the operation.</p>"},{id:"fail",q:"Do failed or abandoned missions count?",a:`<ul><li><b>Main objective done:</b> it counts. Dying, or failing extraction afterwards, doesn't take it back.</li><li><b>Left before the main objective:</b> it adds nothing, but it takes nothing away either.</li><li><b>Kills in a mission that ends early:</b> <span class="faq-unsure">{unsure}</span> reports differ. Don't count on them.</li></ul>`},{id:"regen",q:"Why does the bar go backwards?",a:"<p>On a liberation, enemy resistance wins back part of the planet every hour: the Helldivers have to beat it before anything moves. A defense doesn't heal, but it has a deadline: if the deadline passes, the planet is lost and its liberation starts again from 0.</p>"},{id:"dss",q:"What do the DSS and Heavy Ordnance change?",a:"<p>This model applies <b>+{dss}</b> for the DSS alone on its planet (zero by default: its presence alone is not a confirmed bonus). While Heavy Ordnance is active, it applies <b>\xD7{hod}</b> on the DSS planet and <b>\xD7{other}</b> elsewhere. These are model assumptions based on observed data, not official constants; see Settings, Advanced.</p>"},{id:"medals",q:"Do I get the medals if I didn't play?",a:`<p><span class="faq-unsure">{unsure}</span> A community report from April 2026 says logging in during the order is required. We have not verified that rule against an official source. Check the in-game reward notice; this site cannot determine your account's eligibility.</p>`},{id:"calls",q:"What do \u201COn track\u201D, \u201CNeeds a push\u201D and the others mean?",a:`<p>The page's five forecasts, from Done to Out of reach. <button type="button" class="linkish" data-help="ex-scale">See them in Help</button></p>`}],live:'<p class="faq-live">{source} On <b>{planet}</b>, an average mission is estimated at <b>+{m}</b>: about <b>{n}</b> equivalent missions for 1%. {remaining} {day}</p>',noLive:`<p class="faq-live">The live value shows here once the page has read the war (it needs the Ministry's recorder).</p>`,checked:"References (community sources; not official rules):",sources:"Something out of date after a patch? Tell us."},feedback:"Something wrong, or an idea? Tell us",rss:"New orders by RSS",source:"Source code",footer:"Unofficial community tool. Data: community API api.helldivers2.dev. Enemy and weapon names from Galactic Wide Web and helldivers-2/json on GitHub. Estimates are based on observed galactic war behavior, not official numbers."},EXPLAIN=`<nav class="ex-toc" aria-label="On this page"><a href="#ex-read">How to read this page</a><a href="#ex-scale">The forecasts</a><a href="#ex-words">Words used here</a><a href="#ex-parts">The parts of the page</a><button type="button" class="linkish" data-faq="count">Managed Democracy for Dummies</button></nav>
<section class="ex-start" id="ex-read"><h3>How to read this page</h3>
<ol><li><b>The call</b> at the top is the one move that changes the Major Order most right now, with the order's forecast beside it.</li>
<li><b>The tabs</b> right under it hold the detail. <b>Races</b> (the first) shows every objective: each bar ends at its goal, and the lighter band is today's pace by the deadline, and the coloured edge on the left is the front. Then the full plan, progress charts, the command log and the war map.</li></ol></section>
<section id="ex-scale"><h3>The forecasts</h3>
<dl class="ex-scale">
<div class="vl-done"><dt><span class="pill vl-done"><span>Done</span></span></dt><dd>The objective, or the whole order, is complete.</dd></div>
<div class="vl-ok"><dt><span class="pill vl-ok"><span>On track</span></span></dt><dd>At today's pace we make it in time.</dd></div>
<div class="vl-push"><dt><span class="pill vl-push"><span>Needs a push</span></span></dt><dd>Winnable, with more Helldivers than today, or with everyone on the call. Also when today's pace makes it just in time, with no margin: one bad night and we miss it.</dd></div>
<div class="vl-record"><dt><span class="pill vl-record"><span>Needs a record</span></span></dt><dd>Only a record turnout wins it: about as much of the playerbase as the best order ever drew.</dd></div>
<div class="vl-out"><dt><span class="pill vl-out"><span>Out of reach</span></span></dt><dd>It would take more than any order has ever drawn, or more than every Helldiver online. The page says so, and points to the move still worth making.</dd></div>
</dl>
<p>Before a few hours of pace are measured, an objective is <b>Too early to call</b>, and it is never called out of reach in its first 3 hours. When an order ends, every objective is <b>Done</b> or <b>Failed</b>.</p></section>
<section id="ex-words"><h3>Words used here</h3>
<dl>
<dt>Regen</dt><dd>On liberation campaigns, positive enemy regen restores health every hour. If Helldiver damage is lower, liberation can slide backwards until it reaches zero. Some planets have zero or negative regen; defenses use a separate health pool and deadline.</dd>
<dt>DSS</dt><dd>The Democracy Space Station, voted from planet to planet. Measured on the war log since 2025, it adds nothing visible to liberation on its own.</dd>
<dt>Heavy Ordnance</dt><dd>The DSS's bombardment: its planet counts about 1.8 times while every other planet drops to about 0.7 (the war's total damage barely moves).</dd>
<dt>Joel</dt><dd>Arrowhead's Game Master, who steers the war by hand through Super Earth Command: goals cut or raised, planets that jump, new attacks. The Command log lists his moves.</dd>
<dt>Front</dt><dd>All the planets of one enemy faction. Kill counts usually count anywhere on that front.</dd>
<dt>Impact multiplier</dt><dd>How much each mission is worth: the game lowers it when more people play. The page reads it live, so the numbers follow today's playerbase.</dd>
</dl></section>
<section id="ex-parts"><h3>The parts of the page</h3>
<dl>
<dt>Best bet</dt><dd>When several orders run at once, the desk compares them, counting Helldivers who help two orders at once (killing bots on a bot planet counts for both). If there aren't enough Helldivers for all of them, the best bet is marked on its tab and the page opens on it.</dd>
<dt>Forecast</dt><dd>Beside the call: the order's call on the five-step scale, and the bars that explain it, Helldivers there against Helldivers needed, or today's pace against the pace needed.</dd>
<dt>When a planet falls</dt><dd>Three things go into it: the planet's own pace over the last 6 hours (it already carries the DSS, Joel's multipliers and how hard the planet is), everyone's strength that week, and the Helldivers still to come. The range is an estimate, not a guaranteed completion window. Historical coverage comes from a retrospective sample of completed liberations; see the Archive for sample sizes and live checks.</dd>
<dt>Plan</dt><dd>Every useful move ranked by importance, with what it changes. "What if\u2026?" shows what happens with more or fewer Helldivers.</dd>
<dt>Progress</dt><dd>How the order got here: progress since it began, the pace it needs, where today's pace leads, hour by hour. Hover or tap a chart to read any moment.</dd>
<dt>Command log</dt><dd>Hand-made changes by Super Earth Command or a scripted enemy push, and the latest Super Earth news. The war is recorded every 10 minutes even while nobody has the page open.</dd>
<dt>Map</dt><dd>Every planet being fought over, at its place in the galaxy, in its owner's colour and sized by its Helldivers. A ring marks the order's planets, brackets the planet of the call, dashed lines the attacks.</dd>
<dt>Kills, samples, operations</dt><dd>The pace needed is compared with the last 24 hours (a full day and night), or the average since the start until a day has been recorded, and the last hour.</dd>
<dt>Option orders</dt><dd>Some orders say Option 1, Option 2: any one of them wins. The forecast and the plan follow the most winnable option.</dd>
<dt>Regions</dt><dd>Planets with regions are taken one region at a time, quickest first; splitting Helldivers across regions slows everything down.</dd>
<dt>Share image, Copy for Discord</dt><dd>The call as a picture or as text, ready for Reddit, Discord or chat, with the desk's best bet when several orders run.</dd>
<dt>Links</dt><dd>The address follows the order and the tab you are on (for example <code>#order=\u2026&amp;tab=plan</code>), so you can link to a call directly.</dd>
<dt>Shortcuts</dt><dd><kbd>Q</kbd> and <kbd>E</kbd> switch tab, <kbd>1</kbd> to <kbd>5</kbd> open a tab, <kbd>P</kbd> opens the planet's conditions and loadout, <kbd>A</kbd> the archive, <kbd>R</kbd> refreshes, <kbd>?</kbd> opens this guide.</dd>
</dl></section>
<p class="ex-limits">Limits: the effect of the DSS and Heavy Ordnance isn't public, the region capture bonus is estimated, weapon-only kill counts can't be turned into a number of Helldivers, and the Game Master can change regen at any time.</p>`;
